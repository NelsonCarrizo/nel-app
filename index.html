<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9E1F63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nel Manicure">
<title>Nel App Manicure</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#26132A; --muted:#8A7690; --line:#F1E1EA;
  --accent:#D6246E; --accent-deep:#8A1554; --accent-ink:#FFFFFF; --accent-soft:#FCE3EF;
  --danger:#C0392B; --warn:#FFF3D6; --warn-ink:#7A5300;
  --shadow-card:0 1px 2px rgba(138,21,84,.06), 0 10px 22px -16px rgba(138,21,84,.28);
  --shadow-pop:0 4px 10px rgba(138,21,84,.14), 0 22px 40px -18px rgba(138,21,84,.34);
  --ease:cubic-bezier(.2,.8,.2,1);
  --display:'Bricolage Grotesque',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Figtree',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .12s var(--ease)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

.wrap{max-width:520px;margin:0 auto;padding:16px 18px 130px}
h1{font:700 22px/1.1 var(--display);letter-spacing:-.01em;margin:0}
h2{font:700 18px/1.2 var(--display);margin:24px 0 10px}
.head2{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.head2 h2{margin:0}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.who{font-size:13px;color:var(--muted)}
.sync{font-size:12px;color:var(--muted)}
.topbar-actions{display:flex;align-items:center;gap:10px;flex:none}
.center{min-height:60vh;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.login{max-width:380px;margin:7vh auto 0}
.login h1{font-size:30px;margin-bottom:6px}

.iconlink{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.iconlink svg{width:20px;height:20px}
.iconlink.active{color:var(--accent);background:var(--accent-soft)}
.iconlink:active{transform:scale(.9)}

.datebar{display:flex;align-items:center;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow-card);display:grid;place-items:center;flex:none}
.iconbtn[disabled]{opacity:.35;box-shadow:none}
.iconbtn:active:not([disabled]){transform:scale(.92)}
.iconbtn svg{width:20px;height:20px}
.datepick{position:relative;flex:1;height:44px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow-card);display:grid;place-items:center;font-weight:600;overflow:hidden}
.datepick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.link{color:var(--accent);font-weight:600;padding:6px 0}
.link.danger{color:var(--danger)}
.link.inv{color:inherit;text-decoration:underline;margin-left:10px;padding:0}
.warn{background:var(--warn);color:var(--warn-ink);border-radius:14px;padding:10px 14px;margin:10px 0 0;font-size:14px}
.warn .link{color:inherit;text-decoration:underline;padding:0;margin-left:4px}

.summary{margin:20px 2px 0}
.lbl{font-size:14px;color:var(--muted);font-weight:500}
.big{font:700 46px/1.05 var(--display);letter-spacing:-.02em;margin:2px 0 6px;transition:transform .18s var(--ease)}
.stats{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--muted);font-size:14px}
.stats b{color:var(--ink);font-weight:600}
.cobro{background:linear-gradient(155deg, var(--accent), var(--accent-deep));color:var(--accent-ink);border-radius:22px;padding:18px 20px;margin-top:20px;box-shadow:var(--shadow-pop)}
.cobro .lbl{color:inherit;opacity:.85}
.cobro .big{font-size:40px}
.cobro .stats{color:inherit;opacity:.92}
.cobro .stats b{color:inherit}
.cobro .link{color:inherit;text-decoration:underline;margin-top:6px;display:inline-block}

.closedbox{background:var(--accent-soft);border-radius:20px;padding:20px;text-align:center;margin-top:16px;box-shadow:var(--shadow-card)}
.closedbox .lbl{font-size:14px;color:var(--muted)}
.closedbox .big{font-size:38px;margin:4px 0 8px;color:var(--accent-deep)}
.closedbox .sub{font-size:14px;color:var(--muted)}

.svcgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.svc{min-height:96px;border-radius:18px;background:var(--surface);border:1.5px solid var(--accent-soft);box-shadow:var(--shadow-card);padding:12px 14px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:8px;transition:transform .12s var(--ease), box-shadow .12s var(--ease), background .12s var(--ease)}
.svc b{font-weight:700;overflow-wrap:anywhere}
.svc .cm{font:700 22px/1 var(--display);color:var(--accent);transition:color .12s var(--ease)}
.svc:active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);transform:scale(.97);box-shadow:var(--shadow-card)}
.svc:active .cm{color:inherit}

.list{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-card);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-top:1px solid var(--line);transition:background .5s ease}
.row:first-child{border-top:0}
button.row:active{background:var(--accent-soft)}
@media (prefers-reduced-motion: no-preference){
  .row.new{animation:rowin .5s var(--ease)}
  @keyframes rowin{0%{background:var(--accent-soft);transform:translateX(-6px);opacity:0}60%{opacity:1}100%{background:transparent;transform:none}}
  .big.pulse{animation:pulse .4s var(--ease)}
  @keyframes pulse{0%{transform:scale(1)}35%{transform:scale(1.08)}100%{transform:scale(1)}}
}
.grow{flex:1;min-width:0}
.nm{font-weight:600;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--muted)}
.amt{font:700 18px/1 var(--display);white-space:nowrap;text-align:right}
.amt small{display:block;font:500 12px/1.2 var(--body);color:var(--muted);margin-bottom:3px}
.amt.zero{font:500 14px/1 var(--body);color:var(--muted)}
.x{width:36px;height:36px;border-radius:12px;color:var(--muted);font-size:22px;line-height:1;display:grid;place-items:center;flex:none}
.x:active{background:var(--accent-soft)}
.tag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600}
.empty{color:var(--muted);margin:4px 2px}
.hint{font-size:13px;color:var(--muted);margin:10px 2px 0}
.cathdr{font:700 15px var(--display);color:var(--accent-deep);margin:18px 2px 6px}
.cathdr:first-child{margin-top:0}

details.pers{border-top:1px solid var(--line)}
details.pers:first-child{border-top:0}
details.pers summary{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;list-style:none}
details.pers summary::-webkit-details-marker{display:none}
details.pers .inner{padding:0 16px 12px;font-size:14px}
.dline{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px dashed var(--line)}
.dline.head{font-weight:700;border-top:1px solid var(--line);padding-top:9px;margin-top:4px}
.dline .x{width:28px;height:28px;font-size:18px}

.btn{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:12px 18px;font-weight:600;min-height:44px;box-shadow:var(--shadow-card)}
.btn:active:not([disabled]){transform:scale(.97)}
.btn[disabled]{opacity:.6;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.danger{background:var(--danger);color:#fff}

.seg{display:flex;background:var(--surface);box-shadow:var(--shadow-card);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 0;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);text-align:center;transition:background .15s var(--ease), color .15s var(--ease)}
.seg button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}

.catgroup{display:flex;flex-wrap:wrap;margin:4px 0 4px}
.catchip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;margin:0 8px 8px 0;font-weight:600}
.catchip input{width:18px;height:18px;accent-color:var(--accent)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);box-shadow:0 -10px 24px -18px rgba(138,21,84,.4);display:grid;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:12px;font-weight:500;border-radius:12px;transition:color .15s var(--ease)}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}
.nav button:active{transform:scale(.92)}

#sheet{position:fixed;inset:0;z-index:40}
.scrim{position:absolute;inset:0;background:rgba(38,19,42,.5)}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:92%;overflow:auto;background:var(--surface);box-shadow:var(--shadow-pop);border-radius:24px 24px 0 0;padding:20px 20px calc(22px + env(safe-area-inset-bottom,0px))}
.panel h2{margin-top:0}
@media (prefers-reduced-motion: no-preference){
  .panel{animation:up .26s var(--ease)}
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  .scrim{animation:fadein .2s ease}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .wrap{transition:opacity .2s var(--ease), transform .2s var(--ease)}
  #toast.show{animation:toastin .24s var(--ease)}
  @keyframes toastin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
}
.fld{display:block;margin-bottom:14px}
.fld span{display:block;font-size:14px;color:var(--muted);margin-bottom:5px;font-weight:500}
.fld input{width:100%;height:48px;border-radius:14px;border:1.5px solid var(--line);background:#FDF8FB;padding:0 14px;font-size:16px;transition:border-color .12s var(--ease)}
.fld input:focus{border-color:var(--accent);outline:none;background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preview{background:var(--accent-soft);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}
.preview b{font-family:var(--display);font-size:18px}
.err{color:var(--danger);min-height:1.2em;margin:0 0 8px;font-size:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.cred{background:var(--accent-soft);border-radius:14px;padding:12px 14px;margin:0 0 14px;font-size:15px}

#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;max-width:488px;margin:0 auto;background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;font-size:14px;font-weight:500;box-shadow:var(--shadow-pop)}
</style>
</head>
<body>
<div id="app"><div class="center">Cargando…</div></div>
<div id="toast" role="status" hidden></div>
<div id="sheet" hidden></div>

<script type="module">
/* =====================================================================
   CONFIGURACIÓN: los datos de tu proyecto de Firebase.
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyBOGjCbKMiu0Sy5kTNgm0O1xR9sySML2bU",
  authDomain: "sin-analytics-84167.firebaseapp.com",
  projectId: "sin-analytics-84167",
  storageBucket: "sin-analytics-84167.firebasestorage.app",
  messagingSenderId: "381236355122",
  appId: "1:381236355122:web:7de8e188e40f2e46f65c2b"
};
const OWNER_USER = 'nel';        // usuario de la dueña (debe coincidir con firestore.rules)
const DOMAIN = 'nelapp.app';     // dominio interno; nadie recibe correos
const OWNER_EMAIL = OWNER_USER + '@' + DOMAIN;
const DEFAULT_CATEGORY = 'Manos';
const FB = 'https://www.gstatic.com/firebasejs/10.14.1/';

const $ = id => document.getElementById(id);
let A, Au, F;
try {
  [A, Au, F] = await Promise.all([
    import(FB + 'firebase-app.js'),
    import(FB + 'firebase-auth.js'),
    import(FB + 'firebase-firestore.js')
  ]);
} catch (e) {
  $('app').innerHTML = '<div class="center">No se pudo cargar la app. Revisá tu conexión y volvé a abrirla.</div>';
  throw e;
}
const { collection, doc, getDoc, setDoc, updateDoc, deleteDoc, writeBatch, onSnapshot, query, where } = F;

const configured = !/PEGAR/.test(JSON.stringify(firebaseConfig));
let app, auth, db;
if (configured) {
  app = A.initializeApp(firebaseConfig);
  auth = Au.getAuth(app);
  try {
    db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) });
  } catch (e) { db = F.getFirestore(app); }
}

/* ---------- utilidades ---------- */
const DAYS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const longDate = s => { const d = parse(s); return cap(DAYS[d.getDay()]) + ' ' + d.getDate() + ' de ' + MONTHS[d.getMonth()]; };
const shortDate = s => { const d = parse(s); return d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0, 3); };
const isSat = s => parse(s).getDay() === 6;
const satOnOrAfter = s => addDays(s, (6 - parse(s).getDay() + 7) % 7);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sum = (arr, fn) => arr.reduce((a, x) => a + fn(x), 0);
const plural = (n, a, b) => n === 1 ? a : b;
function fmt(n) {
  n = Math.round(n * 100) / 100;
  const neg = n < 0, parts = Math.abs(n).toFixed(2).split('.');
  const g = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (neg ? '-' : '') + '$' + g + (parts[1] === '00' ? '' : ',' + parts[1]);
}
const pctText = p => String(p).replace('.', ',');
const parsePrice = v => { const n = parseFloat(String(v).trim().replace(/\./g, '').replace(',', '.')); return isFinite(n) ? n : NaN; };
const parsePct = v => { const n = parseFloat(String(v).trim().replace(',', '.')); return isFinite(n) ? n : NaN; };
const commissionOf = (price, pct) => Math.round(price * pct) / 100;
const hhmm = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const normUser = s => String(s).trim().toLowerCase().replace(/\s+/g, '');
const famt = n => hideAmounts ? '•••••' : fmt(n);

/* ---------- estado ---------- */
const today = ymd(new Date());
let booting = true, authMsg = '', loginUser = '', busyLogin = false;
let fbUser = null, role = null, staffName = '';
let services = [], staffList = [];
let myCategories = null, dayClosedToday = false, hideAmounts = false;
let myRecs = [], myAdvances = [], recsReady = false, pending = false;
let recsByStaff = {}, advByStaff = {}, ownerDayStatus = {};
let view = 'hoy', selDate = today, weekEnd = satOnOrAfter(today), historyMode = 'semana';
let sheet = null, lastAction = null, lastView = null, lastDayTotalSeen = null, justAddedId = null;
const openStaff = new Set();
let unsubs = [], unsubRecs = null, unsubAdv = null, rangeFrom = '', rangeTo = '';
let unsubOwnerRecs = [], unsubOwnerAdv = [], unsubOwnerDay = [];

function cleanup() {
  unsubs.forEach(f => f()); unsubs = [];
  if (unsubRecs) { unsubRecs(); unsubRecs = null; }
  if (unsubAdv) { unsubAdv(); unsubAdv = null; }
  unsubOwnerRecs.forEach(f => f()); unsubOwnerRecs = [];
  unsubOwnerAdv.forEach(f => f()); unsubOwnerAdv = [];
  unsubOwnerDay.forEach(f => f()); unsubOwnerDay = [];
  services = []; staffList = []; recsByStaff = {}; advByStaff = {}; ownerDayStatus = {};
  myRecs = []; myAdvances = []; myCategories = null; dayClosedToday = false;
  recsReady = false; pending = false; rangeFrom = ''; rangeTo = ''; sheet = null;
  renderSheet();
}

/* ---------- catálogo de categorías ---------- */
function allCategories() {
  const set = new Set();
  services.forEach(s => set.add(s.category || DEFAULT_CATEGORY));
  return [...set].sort((a, b) => a.localeCompare(b));
}

/* ---------- suscripciones en tiempo real ---------- */
const byOrder = (a, b) => (a.order || 0) - (b.order || 0);

function startStaff() {
  view = 'hoy'; selDate = today; weekEnd = satOnOrAfter(today); historyMode = 'semana';
  try { hideAmounts = localStorage.getItem('nel-hide-' + fbUser.uid) === '1'; } catch (e) {}
  unsubs.push(onSnapshot(collection(db, 'services'), snap => {
    services = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort(byOrder);
    maybeOnboard(); render();
  }, err => console.error(err)));
  unsubs.push(onSnapshot(doc(db, 'staff', fbUser.uid), snap => {
    if (snap.exists()) { const d = snap.data(); staffName = d.name || ''; myCategories = d.categories || {}; }
    maybeOnboard(); render();
  }, err => console.error(err)));
  unsubs.push(onSnapshot(doc(db, 'staff', fbUser.uid, 'days', today), snap => {
    dayClosedToday = snap.exists() && snap.data().closed === true;
    render();
  }, err => console.error(err)));
  loadRange(addDays(today, -45), addDays(today, 14));
}
function maybeOnboard() {
  if (myCategories === null || !services.length) return;
  if (Object.keys(myCategories).length === 0) {
    if (!sheet || sheet.type !== 'onboard') { sheet = { type: 'onboard', categories: {} }; renderSheet(); }
  } else if (sheet && sheet.type === 'onboard') { sheet = null; renderSheet(); }
}

function loadRange(from, to) {
  if (unsubRecs) unsubRecs();
  if (unsubAdv) unsubAdv();
  rangeFrom = from; rangeTo = to; recsReady = false;
  const qr = query(collection(db, 'staff', fbUser.uid, 'records'), where('date', '>=', from), where('date', '<=', to));
  unsubRecs = onSnapshot(qr, { includeMetadataChanges: true }, snap => {
    myRecs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    pending = snap.metadata.hasPendingWrites;
    recsReady = true;
    render();
  }, err => { console.error(err); toast('No se pudieron cargar tus datos.'); });
  const qa = query(collection(db, 'staff', fbUser.uid, 'advances'), where('date', '>=', from), where('date', '<=', to));
  unsubAdv = onSnapshot(qa, snap => { myAdvances = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, err => console.error(err));
}
function needRange(...dates) {
  if (!fbUser || role !== 'staff') return;
  for (const d of dates) {
    if (!rangeFrom || d < rangeFrom || d > rangeTo) { loadRange(addDays(d, -45), addDays(d, 14)); return; }
  }
}

function startOwner() {
  view = 'servicios'; weekEnd = satOnOrAfter(today);
  unsubs.push(onSnapshot(collection(db, 'prices'), snap => {
    services = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort(byOrder);
    render();
  }, err => console.error(err)));
  unsubs.push(onSnapshot(collection(db, 'staff'), snap => {
    staffList = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => String(a.name).localeCompare(String(b.name)));
    subscribeOwnerWeek(); subscribeOwnerAdvances(); subscribeOwnerDayStatus();
    render();
  }, err => console.error(err)));
}
function subscribeOwnerWeek() {
  unsubOwnerRecs.forEach(f => f()); unsubOwnerRecs = []; recsByStaff = {};
  const from = addDays(weekEnd, -6), to = weekEnd;
  staffList.forEach(s => {
    const q = query(collection(db, 'staff', s.id, 'records'), where('date', '>=', from), where('date', '<=', to));
    unsubOwnerRecs.push(onSnapshot(q, snap => {
      recsByStaff[s.id] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }, err => console.error(err)));
  });
}
function subscribeOwnerAdvances() {
  unsubOwnerAdv.forEach(f => f()); unsubOwnerAdv = []; advByStaff = {};
  const from = addDays(weekEnd, -6), to = weekEnd;
  staffList.forEach(s => {
    const q = query(collection(db, 'staff', s.id, 'advances'), where('date', '>=', from), where('date', '<=', to));
    unsubOwnerAdv.push(onSnapshot(q, snap => {
      advByStaff[s.id] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }, err => console.error(err)));
  });
}
function subscribeOwnerDayStatus() {
  unsubOwnerDay.forEach(f => f()); unsubOwnerDay = []; ownerDayStatus = {};
  staffList.forEach(s => {
    unsubOwnerDay.push(onSnapshot(doc(db, 'staff', s.id, 'days', today), snap => {
      ownerDayStatus[s.id] = snap.exists() && snap.data().closed === true;
      render();
    }, err => console.error(err)));
  });
}

/* ---------- sesión ---------- */
function friendlyAuthError(e) {
  const c = e && e.code || '';
  if (c === 'auth/invalid-credential' || c === 'auth/wrong-password' || c === 'auth/user-not-found' || c === 'auth/invalid-email') return 'Usuario o clave incorrectos.';
  if (c === 'auth/too-many-requests') return 'Demasiados intentos. Esperá unos minutos y probá de nuevo.';
  if (c === 'auth/network-request-failed') return 'Sin conexión. Revisá tu internet.';
  if (c === 'auth/email-already-in-use') return 'Ese usuario ya existe. Elegí otro.';
  if (c === 'auth/weak-password') return 'La clave debe tener al menos 6 caracteres.';
  return 'No se pudo completar. Intentá de nuevo.';
}

if (configured) {
  Au.onAuthStateChanged(auth, async user => {
    cleanup();
    booting = false;
    if (!user) { fbUser = null; role = null; render(); return; }
    fbUser = user;
    if ((user.email || '').toLowerCase() === OWNER_EMAIL) {
      role = 'owner'; startOwner(); render(); return;
    }
    try {
      const snap = await getDoc(doc(db, 'staff', user.uid));
      if (!snap.exists()) { authMsg = 'Tu usuario no está habilitado. Avisale a Nel.'; await Au.signOut(auth); return; }
      role = 'staff'; startStaff(); render();
    } catch (e) {
      console.error(e);
      authMsg = 'No se pudo verificar tu usuario. Revisá la conexión.';
      await Au.signOut(auth);
    }
  });
} else {
  booting = false;
}

async function doLogin(u, p) {
  authMsg = ''; loginUser = u;
  if (!u || !p) { authMsg = 'Escribí tu usuario y tu clave.'; render(); return; }
  busyLogin = true; render();
  try {
    await Au.signInWithEmailAndPassword(auth, normUser(u) + '@' + DOMAIN, p);
  } catch (e) { authMsg = friendlyAuthError(e); }
  busyLogin = false;
  if (!fbUser) render();
}

/* --- equipo --- */
function staffWeek(sat) {
  const from = addDays(sat, -6);
  const recs = myRecs.filter(r => r.date >= from && r.date <= sat);
  return { recs, total: sum(recs, r => r.commission), days: new Set(recs.map(r => r.date)).size };
}

function viewHoy() {
  const recs = myRecs.filter(r => r.date === selDate).sort((a, b) => a.t - b.t);
  const tot = sum(recs, r => r.commission);
  const isToday = selDate === today;
  let flash = false;
  if (isToday && recsReady) {
    flash = lastDayTotalSeen !== null && tot !== lastDayTotalSeen;
    lastDayTotalSeen = tot;
  }
  let h = dateBarHoy();
  if (!isToday) h += '<p class="warn">Estás viendo un día pasado. No se puede cargar acá.<button class="link" data-a="date-today">Volver a hoy</button></p>';
  h += '<section class="summary"><div class="lbl">Tu comisión del día</div><div class="big' + (flash ? ' pulse' : '') + '">' + famt(tot) + '</div>' +
       '<div class="stats"><span><b>' + recs.length + '</b> ' + plural(recs.length, 'servicio', 'servicios') + '</span></div></section>';
  if (isSat(selDate)) {
    const w = staffWeek(selDate);
    h += '<section class="cobro"><div class="lbl">Día de pago: a cobrar hoy</div><div class="big">' + famt(w.total) + '</div>' +
         '<div class="stats"><span>Semana del ' + shortDate(addDays(selDate, -6)) + ' al ' + shortDate(selDate) + ', ' + w.days + ' ' + plural(w.days, 'día trabajado', 'días trabajados') + '</span></div>' +
         '<button class="link" data-a="goto-semana">Ver detalle de la semana</button></section>';
  }
  if (isToday) {
    if (dayClosedToday) {
      h += '<div class="closedbox"><div class="lbl">Jornada finalizada</div><div class="big">' + famt(tot) + '</div>' +
           '<p class="sub">Si fue un error, avisale a Nel para que la reabra.</p></div>';
    } else {
      const mine = services.filter(s => myCategories && myCategories[s.category || DEFAULT_CATEGORY]);
      h += '<h2>Tocá para anotar</h2>';
      if (mine.length) {
        h += '<div class="svcgrid">' + mine.map(s =>
          '<button class="svc" data-a="add-rec" data-id="' + s.id + '"><b>' + esc(s.name) + '</b><span class="cm">+' + famt(s.commission) + '</span></button>'
        ).join('') + '</div>';
      } else h += '<p class="empty">No tenés servicios habilitados todavía. Avisale a Nel.</p>';
      if (recs.length) h += '<button class="btn ghost" style="width:100%;margin-top:14px" data-a="finish-day">Finalizar jornada</button>';
    }
  }
  h += '<h2>' + (isToday ? 'Anotados del día' : 'Servicios de ese día') + '</h2>';
  if (!recsReady) h += '<p class="empty">Cargando…</p>';
  else if (recs.length) {
    h += '<div class="list">' + recs.map(r =>
      '<div class="row' + (r.id === justAddedId ? ' new' : '') + '"><div class="grow"><div class="nm">' + esc(r.serviceName) + '</div><div class="sub">' + hhmm(r.t) + '</div></div>' +
      '<div class="amt">+' + famt(r.commission) + '</div>' +
      '<button class="x" data-a="del-rec" data-id="' + r.id + '" aria-label="Quitar ' + esc(r.serviceName) + '">×</button></div>'
    ).join('') + '</div>';
  } else h += '<p class="empty">Todavía no se anotó nada este día.</p>';
  return h;
}

function viewSemana() {
  const w = staffWeek(weekEnd);
  const from = addDays(weekEnd, -6);
  const adv = myAdvances.filter(a => a.date >= from && a.date <= weekEnd);
  const advSum = sum(adv, a => a.amount);
  const net = w.total - advSum;
  let h = weekBar('week-prev', 'week-next', 'Del ' + shortDate(from) + ' al ' + shortDate(weekEnd));
  if (weekEnd !== satOnOrAfter(today)) h += '<button class="link" data-a="week-now">Ir a esta semana</button>';
  h += '<section class="cobro"><div class="lbl">A cobrar el ' + longDate(weekEnd).toLowerCase() + '</div><div class="big">' + famt(net) + '</div>' +
       '<div class="stats"><span><b>' + w.recs.length + '</b> ' + plural(w.recs.length, 'servicio', 'servicios') + '</span>' +
       '<span><b>' + w.days + '</b> ' + plural(w.days, 'día trabajado', 'días trabajados') + '</span>' +
       (advSum > 0 ? '<span>Comisión ' + famt(w.total) + ', adelantos -' + famt(advSum) + '</span>' : '') + '</div></section>';
  h += '<div class="head2"><h2>Adelantos</h2><button class="link" data-a="new-advance">Registrar</button></div>';
  if (adv.length) {
    h += '<div class="list">' + adv.slice().sort((a, b) => b.t - a.t).map(a =>
      '<div class="row"><div class="grow"><div class="nm">' + shortDate(a.date) + '</div>' + (a.note ? '<div class="sub">' + esc(a.note) + '</div>' : '') + '</div>' +
      '<div class="amt">-' + famt(a.amount) + '</div>' +
      '<button class="x" data-a="del-adv" data-id="' + a.id + '" aria-label="Quitar adelanto">×</button></div>'
    ).join('') + '</div>';
  } else h += '<p class="empty">No registraste adelantos esta semana.</p>';
  h += '<h2>Detalle por día</h2>';
  if (!recsReady) return h + '<p class="empty">Cargando…</p>';
  h += '<div class="list">';
  for (let i = -6; i <= 0; i++) {
    const d = addDays(weekEnd, i), rs = w.recs.filter(r => r.date === d), e = sum(rs, r => r.commission);
    h += '<button class="row" data-a="goto-day" data-date="' + d + '"><div class="grow"><div class="nm">' + cap(DAYS[parse(d).getDay()]) + ' ' + parse(d).getDate() + (d === today ? '<span class="tag">hoy</span>' : '') + '</div>' +
         '<div class="sub">' + (rs.length ? rs.length + ' ' + plural(rs.length, 'servicio', 'servicios') : 'Sin servicios') + '</div></div>' +
         (rs.length ? '<div class="amt">' + famt(e) + '</div>' : '<div class="amt zero">—</div>') + '</button>';
  }
  return h + '</div><p class="hint">La semana va de domingo a sábado y se cobra el sábado.</p>';
}

function viewHistorial() {
  let h = '<div class="seg" role="tablist">' +
    '<button data-a="hist-mode" data-v="semana" aria-current="' + (historyMode === 'semana') + '">Semanas</button>' +
    '<button data-a="hist-mode" data-v="mes" aria-current="' + (historyMode === 'mes') + '">Meses</button></div>';
  if (!recsReady) return h + '<p class="empty">Cargando…</p>';
  h += '<h2 style="margin-top:20px">' + (historyMode === 'semana' ? 'Últimas semanas' : 'Últimos meses') + '</h2><div class="list">';
  if (historyMode === 'semana') {
    let sat = satOnOrAfter(today);
    for (let i = 0; i < 10; i++) {
      const from = addDays(sat, -6);
      const rs = myRecs.filter(r => r.date >= from && r.date <= sat);
      const adv = myAdvances.filter(a => a.date >= from && a.date <= sat);
      const net = sum(rs, r => r.commission) - sum(adv, a => a.amount);
      const days = new Set(rs.map(r => r.date)).size;
      h += '<button class="row" data-a="goto-week" data-date="' + sat + '"><div class="grow"><div class="nm">Semana del ' + shortDate(from) + ' al ' + shortDate(sat) + '</div>' +
           '<div class="sub">' + days + ' ' + plural(days, 'día trabajado', 'días trabajados') + '</div></div>' +
           (rs.length || adv.length ? '<div class="amt">' + famt(net) + '</div>' : '<div class="amt zero">—</div>') + '</button>';
      sat = addDays(sat, -7);
    }
  } else {
    const cur = parse(today); cur.setDate(1);
    for (let i = 0; i < 6; i++) {
      const y = cur.getFullYear(), m = cur.getMonth(), key = y + '-' + pad(m + 1);
      const rs = myRecs.filter(r => r.date.slice(0, 7) === key);
      const adv = myAdvances.filter(a => a.date.slice(0, 7) === key);
      const net = sum(rs, r => r.commission) - sum(adv, a => a.amount);
      const days = new Set(rs.map(r => r.date)).size;
      h += '<div class="row"><div class="grow"><div class="nm">' + cap(MONTHS[m]) + ' ' + y + '</div>' +
           '<div class="sub">' + days + ' ' + plural(days, 'día trabajado', 'días trabajados') + '</div></div>' +
           (rs.length || adv.length ? '<div class="amt">' + famt(net) + '</div>' : '<div class="amt zero">—</div>') + '</div>';
      cur.setMonth(m - 1);
    }
  }
  return h + '</div><p class="hint">Los montos ya tienen restados los adelantos. Puede no incluir semanas muy antiguas.</p>';
}

function viewCobros() {
  const from = addDays(weekEnd, -6);
  let grand = 0, rows = '';
  staffList.forEach(s => {
    const rs = (recsByStaff[s.id] || []).filter(r => r.date >= from && r.date <= weekEnd);
    const adv = (advByStaff[s.id] || []).filter(a => a.date >= from && a.date <= weekEnd);
    const tot = sum(rs, r => r.commission), advSum = sum(adv, a => a.amount), net = tot - advSum;
    grand += net;
    const days = new Set(rs.map(r => r.date)).size;
    let inner = '';
    for (let i = -6; i <= 0; i++) {
      const d = addDays(weekEnd, i), rd = rs.filter(r => r.date === d).sort((a, b) => a.t - b.t);
      if (!rd.length) continue;
      inner += '<div class="dline head"><span>' + cap(DAYS[parse(d).getDay()]) + ' ' + parse(d).getDate() + '</span><span>' + fmt(sum(rd, r => r.commission)) + '</span></div>';
      rd.forEach(r => {
        inner += '<div class="dline"><span>' + hhmm(r.t) + ' ' + esc(r.serviceName) + '</span><span>' + fmt(r.commission) +
                 ' <button class="x" data-a="owner-del-rec" data-sid="' + s.id + '" data-id="' + r.id + '" aria-label="Quitar">×</button></span></div>';
      });
    }
    if (adv.length) {
      inner += '<div class="dline head"><span>Adelantos</span><span>-' + fmt(advSum) + '</span></div>';
      adv.forEach(a => {
        inner += '<div class="dline"><span>' + shortDate(a.date) + (a.note ? ' · ' + esc(a.note) : '') + '</span><span>-' + fmt(a.amount) +
                 ' <button class="x" data-a="owner-del-adv" data-sid="' + s.id + '" data-id="' + a.id + '" aria-label="Quitar">×</button></span></div>';
      });
    }
    if (!inner) inner = '<p class="sub" style="margin:6px 0 0">Sin servicios esta semana.</p>';
    rows += '<details class="pers" data-sid="' + s.id + '"' + (openStaff.has(s.id) ? ' open' : '') + '><summary><div class="grow"><div class="nm">' + esc(s.name) + '</div>' +
            '<div class="sub">' + days + ' ' + plural(days, 'día trabajado', 'días trabajados') + ', ' + rs.length + ' ' + plural(rs.length, 'servicio', 'servicios') +
            (advSum > 0 ? ', adelantos ' + fmt(advSum) : '') + '</div></div>' +
            '<div class="amt">' + fmt(net) + '</div></summary><div class="inner">' + inner + '</div></details>';
  });
  let h = weekBar('week-prev', 'week-next', 'Del ' + shortDate(from) + ' al ' + shortDate(weekEnd));

    el.innerHTML = '<div class="center"><div><h1>Falta un paso</h1><p>Abrí el archivo index.html y pegá los datos de tu proyecto de Firebase donde dice PEGAR_AQUI.</p></div></div>';
    return;
  }
  if (fbUser && !role) { el.innerHTML = '<div class="center">Cargando…</div>'; return; }
  if (!fbUser) {
    el.innerHTML = '<div class="wrap">' + viewLogin() + '</div>';
    return;
  }
  const tabs = role === 'owner'
    ? [['servicios', 'Servicios'], ['equipo', 'Equipo'], ['cobros', 'Cobros']]
    : [['hoy', 'Hoy'], ['semana', 'Semana'], ['historial', 'Historial']];
  let body;
  if (view === 'hoy') body = viewHoy();
  else if (view === 'semana') body = viewSemana();
  else if (view === 'historial') body = viewHistorial();
  else if (view === 'equipo') body = viewEquipo();
  else if (view === 'cobros') body = viewCobros();
  else body = viewServicios();
  const eyeBtn = role === 'staff' ? '<button class="iconlink' + (hideAmounts ? ' active' : '') + '" data-a="toggle-eye" aria-label="' + (hideAmounts ? 'Mostrar montos' : 'Ocultar montos') + '">' + (hideAmounts ? EYE_OFF : EYE) + '</button>' : '';
  el.innerHTML = '<div class="wrap"><div class="topbar"><div><h1>Nel App Manicure</h1><div class="who">' +
    (role === 'owner' ? 'Panel central' : 'Hola, ' + esc(staffName)) + '</div>' + (pending ? '<div class="sync">Sincronizando…</div>' : '') +
    '</div><div class="topbar-actions">' + eyeBtn + '<button class="link" data-a="logout">Salir</button></div></div>' + body + '</div>' +
    '<nav class="nav" style="grid-template-columns:repeat(' + tabs.length + ',1fr)" aria-label="Secciones">' +
    tabs.map(t => '<button data-a="tab" data-v="' + t[0] + '" aria-current="' + (view === t[0] ? 'page' : 'false') + '">' + ICON[t[0]] + t[1] + '</button>').join('') + '</nav>';
  if (lastView !== null && lastView !== view) animateView();
  lastView = view;
}
function animateView() {
  const w = document.querySelector('.wrap');
  if (!w || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  w.style.opacity = '0'; w.style.transform = 'translateY(6px)';
  requestAnimationFrame(() => { w.style.opacity = '1'; w.style.transform = 'none'; });
}

/* ---------- hoja de edición ---------- */
function previewText() {
  const p = parsePrice(sheet.price), c = parsePct(sheet.pct);
  return (p > 0 && c >= 0 && c <= 100) ? fmt(commissionOf(p, c)) : '—';
}
function catCheckboxes(selected) {
  return '<div class="catgroup">' + allCategories().map(c =>
    '<label class="catchip"><input type="checkbox" data-cat="' + esc(c) + '"' + (selected[c] ? ' checked' : '') + '> ' + esc(c) + '</label>'
  ).join('') + '</div>';
}
function renderSheet(focusId) {
  const el = $('sheet');
  if (!sheet) { el.innerHTML = ''; el.hidden = true; return; }
  el.hidden = false;
  const s = sheet; let title = '', body = '';
  if (s.type === 'service') {
    title = s.id ? 'Editar servicio' : 'Nuevo servicio';
    if (s.confirm) {
      body = '<p>¿Eliminar «' + esc(s.name) + '»? Los servicios ya anotados por tu equipo se mantienen.</p>' +
        '<div class="actions"><button class="btn danger" data-a="service-delete-yes">Sí, eliminar</button><button class="btn ghost" data-a="service-delete-no">No, volver</button></div>';
    } else {
      body = '<label class="fld"><span>Nombre</span><input id="f-name" type="text" value="' + esc(s.name) + '" placeholder="Manos semi" autocomplete="off"></label>' +
        '<label class="fld"><span>Categoría</span><input id="f-cat" list="cat-list" type="text" value="' + esc(s.category) + '" placeholder="Manos" autocomplete="off">' +
        '<datalist id="cat-list">' + allCategories().map(c => '<option value="' + esc(c) + '">').join('') + '</datalist></label>' +
        '<div class="two"><label class="fld"><span>Valor ($)</span><input id="f-price" inputmode="numeric" value="' + esc(s.price) + '" placeholder="25000" autocomplete="off"></label>' +
        '<label class="fld"><span>Comisión (%)</span><input id="f-pct" inputmode="decimal" value="' + esc(s.pct) + '" placeholder="30" autocomplete="off"></label></div>' +
        '<div class="preview"><span>Comisión por servicio</span><b id="f-prev">' + previewText() + '</b></div>' +
        '<p class="err" id="f-err" role="alert"></p>' +
        '<div class="actions"><button class="btn" data-a="service-save">Guardar</button><button class="btn ghost" data-a="sheet-close">Cancelar</button></div>' +
        (s.id ? '<div style="margin-top:14px"><button class="link danger" data-a="service-delete">Eliminar servicio</button></div><p class="hint">Los cambios no modifican lo que ya se anotó en días anteriores.</p>' : '');
    }
  } else if (s.type === 'staff-new') {
    title = 'Nueva persona';
    if (s.done) {
      body = '<p>Listo. Pasale estos datos a ' + esc(s.done.name) + ':</p><div class="cred">Usuario: <b>' + esc(s.done.user) + '</b><br>Clave: <b>' + esc(s.done.pass) + '</b></div>' +
        '<p class="hint">Cuando entre por primera vez va a elegir qué servicios hace.</p>' +
        '<div class="actions"><button class="btn" data-a="sheet-close">Listo</button></div>';
    } else {
      body = '<label class="fld"><span>Nombre</span><input id="s-name" type="text" value="' + esc(s.name) + '" placeholder="Ana" autocomplete="off"></label>' +
        '<label class="fld"><span>Usuario (sin espacios)</span><input id="s-user" type="text" value="' + esc(s.user) + '" placeholder="ana" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off"></label>' +
        '<label class="fld"><span>Clave (mínimo 6 caracteres)</span><input id="s-pass" type="text" value="' + esc(s.pass) + '" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off"></label>' +
        '<p class="err" id="f-err" role="alert"></p>' +
        '<div class="actions"><button class="btn" data-a="staff-save"' + (s.busy ? ' disabled' : '') + '>' + (s.busy ? 'Creando…' : 'Crear usuario') + '</button><button class="btn ghost" data-a="sheet-close">Cancelar</button></div>';
    }
  } else if (s.type === 'staff-del') {
    title = 'Quitar persona';
    body = '<p>¿Quitar a ' + esc(s.name) + '? Ya no va a poder entrar a la app. Sus servicios anotados se mantienen.</p>' +
      '<div class="actions"><button class="btn danger" data-a="staff-delete-yes">Sí, quitar</button><button class="btn ghost" data-a="sheet-close">No, volver</button></div>';
  } else if (s.type === 'staff-cat') {
    title = 'Servicios de ' + esc(s.name);
    body = (allCategories().length ? catCheckboxes(s.categories) : '<p class="empty">Primero cargá servicios con una categoría, en Servicios.</p>') +
      '<p class="err" id="f-err" role="alert"></p>' +
      '<div class="actions"><button class="btn" data-a="staffcat-save">Guardar</button><button class="btn ghost" data-a="sheet-close">Cancelar</button></div>';
  } else if (s.type === 'onboard') {
    title = '¿Qué servicios hacés?';
    body = '<p class="sub" style="margin:0 0 12px">Elegí lo que vas a registrar. Nel puede sumarte otros después.</p>' +
      catCheckboxes(s.categories) +
      '<p class="err" id="f-err" role="alert"></p>' +
      '<div class="actions"><button class="btn" data-a="onboard-save">Empezar</button></div>';
  } else if (s.type === 'finish-confirm') {
    title = 'Finalizar jornada';
    body = '<p>Vas a cerrar el día de hoy. Tu comisión de hoy es ' + famt(s.total) + '. Si necesitás cargar algo más, pedile a Nel que la reabra.</p>' +
      '<div class="actions"><button class="btn" data-a="finish-day-yes">Sí, finalizar</button><button class="btn ghost" data-a="sheet-close">Cancelar</button></div>';
  } else if (s.type === 'advance') {
    title = 'Registrar adelanto';
    body = '<label class="fld"><span>Monto ($)</span><input id="a-amount" inputmode="numeric" value="' + esc(s.amount) + '" placeholder="5000" autocomplete="off"></label>' +
      '<label class="fld"><span>Nota (opcional)</span><input id="a-note" type="text" value="' + esc(s.note) + '" placeholder="Ej: para nafta" autocomplete="off"></label>' +
      '<p class="err" id="f-err" role="alert"></p>' +
      '<div class="actions"><button class="btn" data-a="advance-save">Guardar</button><button class="btn ghost" data-a="sheet-close">Cancelar</button></div>';
  }
  const scrimAttr = s.type === 'onboard' ? '' : ' data-a="sheet-close"';
  el.innerHTML = '<div class="scrim"' + scrimAttr + '></div><div class="panel" role="dialog" aria-modal="true" aria-labelledby="sh-t"><h2 id="sh-t">' + title + '</h2>' + body + '</div>';
  if (focusId) { const f = $(focusId); if (f) f.focus(); }
}
const setErr = msg => { const e = $('f-err'); if (e) e.textContent = msg; };

/* ---------- avisos ---------- */
let toastT;
function toast(msg, undo) {
  const t = $('toast');
  t.innerHTML = esc(msg) + (undo ? '<button class="link inv" data-a="undo">Deshacer</button>' : '');
  t.hidden = false;
  t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.hidden = true; }, 4000);
}

/* ---------- acciones ---------- */
function addRecord(s) {
  if (selDate !== today || dayClosedToday) return;
  const ref = doc(collection(db, 'staff', fbUser.uid, 'records'));
  const rec = { serviceId: s.id, serviceName: s.name, commission: s.commission, date: selDate, t: Date.now() };
  lastAction = { kind: 'added', sid: fbUser.uid, id: ref.id };
  justAddedId = ref.id;
  setTimeout(() => { justAddedId = null; render(); }, 650);
  setDoc(ref, rec).catch(e => { console.error(e); toast('No se pudo anotar. Actualizá e intentá de nuevo.'); });
  toast('Anotado: ' + s.name + ' ' + famt(s.commission), true);
}
function removeRecord(sid, id, list) {
  const rec = list.find(r => r.id === id); if (!rec) return;
  const data = { serviceId: rec.serviceId, serviceName: rec.serviceName, commission: rec.commission, date: rec.date, t: rec.t };
  lastAction = { kind: 'removed', sid, id, data };
  deleteDoc(doc(db, 'staff', sid, 'records', id)).catch(e => { console.error(e); toast('No se pudo quitar.'); });
  toast('Servicio quitado', true);
}
function undo() {
  const a = lastAction; lastAction = null; $('toast').hidden = true;
  if (!a) return;
  if (a.kind === 'added') deleteDoc(doc(db, 'staff', a.sid, 'records', a.id)).catch(console.error);
  else setDoc(doc(db, 'staff', a.sid, 'records', a.id), a.data).catch(e => { console.error(e); toast('No se pudo deshacer.'); });
}

function saveService() {
  const name = sheet.name.trim(), price = parsePrice(sheet.price), pct = parsePct(sheet.pct);
  const category = (sheet.category || '').trim() || DEFAULT_CATEGORY;
  if (!name) return setErr('Escribí el nombre del servicio.');
  if (!(price > 0)) return setErr('Ingresá un valor mayor a 0.');
  if (!(pct >= 0 && pct <= 100)) return setErr('La comisión va de 0 a 100.');
  const existing = services.find(x => x.id === sheet.id);
  const id = sheet.id || doc(collection(db, 'prices')).id;
  const order = existing ? (existing.order || Date.now()) : Date.now();
  const b = writeBatch(db);
  b.set(doc(db, 'prices', id), { name, price, pct, category, order });
  b.set(doc(db, 'services', id), { name, commission: commissionOf(price, pct), category, order });
  b.commit().catch(e => { console.error(e); toast('No se pudo guardar el servicio.'); });
  sheet = null; renderSheet();
}
function deleteService() {
  const id = sheet.id, b = writeBatch(db);
  b.delete(doc(db, 'prices', id)); b.delete(doc(db, 'services', id));
  b.commit().catch(e => { console.error(e); toast('No se pudo eliminar.'); });
  sheet = null; renderSheet();
}

async function saveStaff() {
  const name = sheet.name.trim(), user = normUser(sheet.user), pass = sheet.pass;
  if (!name) return setErr('Escribí el nombre.');
  if (!/^[a-z0-9._-]{3,}$/.test(user)) return setErr('El usuario necesita 3 o más letras o números, sin espacios ni acentos.');
  if (user === OWNER_USER) return setErr('Ese usuario está reservado. Elegí otro.');
  if (pass.length < 6) return setErr('La clave debe tener al menos 6 caracteres.');
  sheet.busy = true; renderSheet();
  try {
    const sec = (A.getApps().find(x => x.name === 'secondary')) || A.initializeApp(firebaseConfig, 'secondary');
    const sAuth = Au.getAuth(sec);
    const cred = await Au.createUserWithEmailAndPassword(sAuth, user + '@' + DOMAIN, pass);
    await setDoc(doc(db, 'staff', cred.user.uid), { name, username: user, created: Date.now(), categories: {} });
    await Au.signOut(sAuth);
    sheet = { type: 'staff-new', done: { name, user, pass } };
    renderSheet();
  } catch (e) {
    console.error(e);
    sheet.busy = false; renderSheet();
    setErr(friendlyAuthError(e));
  }
}
function finalizeDay() {
  setDoc(doc(db, 'staff', fbUser.uid, 'days', today), { closed: true, closedAt: Date.now() }).catch(e => { console.error(e); toast('No se pudo finalizar la jornada.'); });
}
function reopenDay(sid) {
  setDoc(doc(db, 'staff', sid, 'days', today), { closed: false, reopenedAt: Date.now() }).catch(e => { console.error(e); toast('No se pudo reabrir.'); });
}
function saveAdvance() {
  const amount = parsePrice(sheet.amount);
  if (!(amount > 0)) return setErr('Ingresá un monto mayor a 0.');
  const ref = doc(collection(db, 'staff', fbUser.uid, 'advances'));
  setDoc(ref, { amount, note: (sheet.note || '').trim(), date: today, t: Date.now() }).catch(e => { console.error(e); toast('No se pudo guardar el adelanto.'); });
  sheet = null; renderSheet();
}

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, id = b.dataset.id;
  if (a === 'tab') {
    view = b.dataset.v;
    if (view === 'semana') { weekEnd = satOnOrAfter(selDate); needRange(addDays(weekEnd, -6), weekEnd); }
    else if (view === 'hoy') needRange(selDate);
    else if (view === 'historial') loadRange(addDays(today, -190), today);
    else if (view === 'cobros') { subscribeOwnerWeek(); subscribeOwnerAdvances(); subscribeOwnerDayStatus(); }
    render(); window.scrollTo(0, 0);
  }
  else if (a === 'logout') { Au.signOut(auth); }
  else if (a === 'toggle-eye') {
    hideAmounts = !hideAmounts;
    try { localStorage.setItem('nel-hide-' + fbUser.uid, hideAmounts ? '1' : '0'); } catch (e) {}
    render();
  }
  else if (a === 'date-prev') { selDate = addDays(selDate, -1); needRange(selDate); render(); }
  else if (a === 'date-next') { if (selDate < today) { selDate = addDays(selDate, 1); needRange(selDate); } render(); }
  else if (a === 'date-today') { selDate = today; needRange(selDate); render(); }
  else if (a === 'add-rec') { const s = services.find(x => x.id === id); if (s) addRecord(s); }
  else if (a === 'del-rec') removeRecord(fbUser.uid, id, myRecs);
  else if (a === 'owner-del-rec') removeRecord(b.dataset.sid, id, recsByStaff[b.dataset.sid] || []);
  else if (a === 'undo') undo();
  else if (a === 'goto-semana') { weekEnd = selDate; view = 'semana'; needRange(addDays(weekEnd, -6), weekEnd); render(); window.scrollTo(0, 0); }
  else if (a === 'goto-day') { selDate = b.dataset.date; view = 'hoy'; needRange(selDate); render(); window.scrollTo(0, 0); }
  else if (a === 'goto-week') { weekEnd = b.dataset.date; view = 'semana'; needRange(addDays(weekEnd, -6), weekEnd); render(); window.scrollTo(0, 0); }
  else if (a === 'hist-mode') { historyMode = b.dataset.v; render(); }
  else if (a === 'week-prev' || a === 'week-next' || a === 'week-now') {
    weekEnd = a === 'week-now' ? satOnOrAfter(today) : addDays(weekEnd, a === 'week-prev' ? -7 : 7);
    if (role === 'owner') { subscribeOwnerWeek(); subscribeOwnerAdvances(); } else needRange(addDays(weekEnd, -6), weekEnd);
    render();
  }
  else if (a === 'new-service') { sheet = { type: 'service', id: null, name: '', price: '', pct: '30', category: DEFAULT_CATEGORY, confirm: false }; renderSheet('f-name'); }
  else if (a === 'edit-service') {
    const s = services.find(x => x.id === id); if (!s) return;
    sheet = { type: 'service', id: s.id, name: s.name, price: String(s.price), pct: pctText(s.pct), category: s.category || DEFAULT_CATEGORY, confirm: false }; renderSheet();
  }
  else if (a === 'service-save') saveService();
  else if (a === 'service-delete') { sheet.confirm = true; renderSheet(); }
  else if (a === 'service-delete-no') { sheet.confirm = false; renderSheet(); }
  else if (a === 'service-delete-yes') deleteService();
  else if (a === 'new-staff') { sheet = { type: 'staff-new', name: '', user: '', pass: '', busy: false, done: null }; renderSheet('s-name'); }
  else if (a === 'staff-save') saveStaff();
  else if (a === 'del-staff') { const s = staffList.find(x => x.id === id); if (s) { sheet = { type: 'staff-del', id: s.id, name: s.name }; renderSheet(); } }
  else if (a === 'staff-delete-yes') {
    deleteDoc(doc(db, 'staff', sheet.id)).catch(err => { console.error(err); toast('No se pudo quitar a la persona.'); });
    sheet = null; renderSheet();
  }
  else if (a === 'edit-staff-cats') {
    const s = staffList.find(x => x.id === id); if (!s) return;
    sheet = { type: 'staff-cat', id: s.id, name: s.name, categories: { ...(s.categories || {}) } }; renderSheet();
  }
  else if (a === 'staffcat-save') {
    updateDoc(doc(db, 'staff', sheet.id), { categories: sheet.categories || {} }).catch(err => { console.error(err); toast('No se pudo guardar.'); });
    sheet = null; renderSheet();
  }
  else if (a === 'reopen-day') reopenDay(id);
  else if (a === 'onboard-save') {
    if (!sheet.categories || !Object.keys(sheet.categories).length) return setErr('Elegí al menos un servicio.');
    updateDoc(doc(db, 'staff', fbUser.uid), { categories: sheet.categories, onboarded: true }).catch(err => { console.error(err); toast('No se pudo guardar.'); });
    sheet = null; renderSheet();
  }
  else if (a === 'finish-day') {
    const recs = myRecs.filter(r => r.date === today);
    sheet = { type: 'finish-confirm', total: sum(recs, r => r.commission) }; renderSheet();
  }
  else if (a === 'finish-day-yes') { finalizeDay(); sheet = null; renderSheet(); }
  else if (a === 'new-advance') { sheet = { type: 'advance', amount: '', note: '' }; renderSheet('a-amount'); }
  else if (a === 'advance-save') saveAdvance();
  else if (a === 'del-adv') deleteDoc(doc(db, 'staff', fbUser.uid, 'advances', id)).catch(err => { console.error(err); toast('No se pudo quitar.'); });
  else if (a === 'owner-del-adv') deleteDoc(doc(db, 'staff', b.dataset.sid, 'advances', id)).catch(err => { console.error(err); toast('No se pudo quitar.'); });
  else if (a === 'sheet-close') { sheet = null; renderSheet(); }
});

document.addEventListener('submit', e => {
  if (e.target.id === 'lg') { e.preventDefault(); doLogin($('lg-u').value, $('lg-p').value); }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'lg-u') { loginUser = t.value; return; }
  if (!sheet) return;
  if (sheet.type === 'service') {
    if (t.id === 'f-name') sheet.name = t.value;
    else if (t.id === 'f-price') sheet.price = t.value;
    else if (t.id === 'f-pct') sheet.pct = t.value;
    else if (t.id === 'f-cat') sheet.category = t.value;
    else return;
    const p = $('f-prev'); if (p) p.textContent = previewText();
  } else if (sheet.type === 'staff-new') {
    if (t.id === 's-name') sheet.name = t.value;
    else if (t.id === 's-user') sheet.user = t.value;
    else if (t.id === 's-pass') sheet.pass = t.value;
  } else if (sheet.type === 'advance') {
    if (t.id === 'a-amount') sheet.amount = t.value;
    else if (t.id === 'a-note') sheet.note = t.value;
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'datein' && t.value) { let v = t.value; if (v > today) v = today; selDate = v; needRange(selDate); render(); }
  else if (t.dataset && t.dataset.cat && sheet) {
    sheet.categories = sheet.categories || {};
    if (t.checked) sheet.categories[t.dataset.cat] = true; else delete sheet.categories[t.dataset.cat];
  }
});

document.addEventListener('toggle', e => {
  const d = e.target;
  if (d && d.classList && d.classList.contains('pers')) {
    if (d.open) openStaff.add(d.dataset.sid); else openStaff.delete(d.dataset.sid);
  }
}, true);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheet && sheet.type !== 'onboard') { sheet = null; renderSheet(); }
});

if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(() => {}); }

render();
</script>
</body>
</html>
