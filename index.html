body::after{content:'';position:fixed;inset:0;z-index:-1;background:rgba(255,255,255,.32)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .12s var(--ease)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

.wrap{max-width:520px;margin:0 auto;padding:16px 18px 130px}
h1{font:700 22px/1.1 var(--display);letter-spacing:-.01em;margin:0}
.credit{text-align:center;font:600 11px/1.4 var(--body);letter-spacing:.04em;color:var(--muted);opacity:.7;margin:30px 0 6px}
.credit b{color:var(--accent-deep);font-weight:700}
.navcredit{grid-column:1/-1;text-align:center;font:600 10.5px/1 var(--body);letter-spacing:.04em;color:var(--muted);opacity:.65;padding-top:6px}
.navcredit b{color:var(--accent-deep);font-weight:700}
.hero{margin:4px 0 18px}
.herogreet{font:700 24px/1.2 var(--display);letter-spacing:-.01em}
.herosub{font-size:13px;color:var(--muted);margin-top:2px;text-transform:capitalize}
.kpirow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background-color:var(--surface);background-image:var(--glass-sheen);border:var(--glass-border);backdrop-filter:blur(16px) saturate(170%);-webkit-backdrop-filter:blur(16px) saturate(170%);border-radius:16px;box-shadow:var(--shadow-card),var(--shadow-glass);padding:12px 10px;text-align:center}
.kpiv{font:700 17px/1.15 var(--display);color:var(--accent-deep)}
.kpil{font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.01em}
h2{font:700 18px/1.2 var(--display);letter-spacing:-.01em;margin:24px 0 10px}
.head2{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.head2 h2{margin:0}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.who{font:700 26px/1.15 var(--display);letter-spacing:-.015em;background:linear-gradient(135deg,var(--accent-deep),var(--accent) 60%,#C98A3E);-webkit-background-clip:text;background-clip:text;color:transparent}
.whosub{font:italic 500 20px/1.15 'Cormorant Garamond',Georgia,serif;letter-spacing:.02em;color:var(--accent-deep);opacity:.88;margin-top:3px}
.outbtn{display:flex;flex-direction:column;align-items:center;gap:1px;padding:0 2px;color:var(--accent-deep);font:600 10px/1.1 var(--body);letter-spacing:.03em}
.outbtn img{width:34px;height:34px;display:block}
.outbtn:active{transform:scale(.92)}
.datepick span{display:inline-flex;align-items:center;gap:9px}
.datepick span img{width:26px;height:26px;display:block;flex:none}
.nav button img{width:26px;height:26px;display:block}
.sync{font-size:12px;color:var(--muted)}
.topbar-actions{display:flex;align-items:flex-start;gap:10px;flex:none}
.topbar>div:not(.topbar-actions){flex:1;min-width:0}
.supbtn{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:0 2px;color:var(--accent);font:700 10px/1.1 var(--body);letter-spacing:.02em}
.supbtn img{width:36px;height:36px;display:block}
.supbtn:active{transform:scale(.92)}
.supbtn .bdg{position:absolute;top:-4px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--danger,#c0392b);color:#fff;font:700 11px/19px var(--body,sans-serif);text-align:center}
.reqrow{padding:12px 0;border-top:1px solid var(--line,rgba(0,0,0,.08))}
.reqrow:first-child{border-top:0}
.reqrow .nm{font-weight:700}
.reqrow .sub{font-size:13px;color:var(--muted);margin-top:2px}
.reqrow .actions{margin-top:10px}
.reqst{font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px;display:inline-block;margin-top:4px}
.reqst.p{background:#fff3cd;color:#7a5b00}.reqst.a{background:#d6f5df;color:#14623a}.reqst.r{background:#fde0e0;color:#8a1f1f}
.center{min-height:60vh;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.login{max-width:380px;margin:7vh auto 0}
.login h1{font-size:30px;margin-bottom:6px}

.iconlink{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.iconlink svg{width:20px;height:20px}
.iconlink.active{color:var(--accent);background:var(--accent-soft)}
.iconlink:active{transform:scale(.9)}

.expbtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:9px 22px 9px 18px;min-height:40px;border-radius:999px;font-weight:700;font-size:14px;letter-spacing:.01em;color:#fff;border:1px solid rgba(255,255,255,.4);background:linear-gradient(180deg,#E9508F 0%,var(--accent) 55%,var(--accent-deep) 135%);box-shadow:0 8px 18px -8px rgba(214,36,110,.7),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 5px rgba(138,21,84,.35);text-shadow:0 1px 1px rgba(138,21,84,.4);transition:transform .15s var(--ease),opacity .15s}

body.owner{

  --shadow-card:0 1px 2px rgba(3,4,94,.5), 0 12px 24px -16px rgba(3,4,94,.9);

function friendlyAuthError(e) {
  const c = e && e.code || '';
  if (c === 'auth/invalid-credential' || c === 'auth/wrong-password' || c === 'auth/user-not-found' || c === 'auth/invalid-email') return 'Usuario o clave incorrectos.';
  if (c === 'auth/too-many-requests') return 'Demasiados intentos. Esperá unos minutos y probá de nuevo.';
  if (c === 'auth/network-request-failed') return 'Sin conexión. Revisá tu internet.';
  if (c === 'auth/email-already-in-use') return 'Ese usuario ya existe. Elegí otro.';
  if (c === 'auth/weak-password') return 'La clave debe tener al menos 6 caracteres.';
  return 'No se pudo completar. Intentá de nuevo.';
}

if (configured) {
  Au.onAuthStateChanged(auth, async user => {
    cleanup();
    booting = false;
    if (!user) { fbUser = null; role = null; render(); return; }
    fbUser = user;
    if ((user.email || '').toLowerCase() === OWNER_EMAIL) {
      role = 'owner'; startOwner(); render(); return;
    }
    try {
      const snap = await getDoc(doc(db, 'staff', user.uid));
      if (!snap.exists()) { authMsg = 'Tu usuario no está habilitado. Avisale a Nel.'; await Au.signOut(auth); return; }
      role = 'staff'; startStaff(); render();
      const d = snap.data();
      if (d.biometricAllowed !== true) { bioForget(); pendingBio = null; } // Nel la desactivó: se borra el acceso guardado en este celular
      else if (pendingBio && (await bioSupported()) && (!bioSaved() || bioSaved().username !== pendingBio.username)) {
        sheet = { type: 'bio-offer' }; renderSheet(); // pendingBio se consume al tocar "Sí, activar" (o se descarta al cerrar la ficha)
      } else pendingBio = null;
    } catch (e) {
      console.error(e);
      authMsg = 'No se pudo verificar tu usuario. Revisá la conexión.';
      await Au.signOut(auth);
    }
  });
} else {
  booting = false;
}

async function doLogin(u, p) {
  authMsg = ''; loginUser = u;
  if (!u || !p) { authMsg = 'Escribí tu usuario y tu clave.'; render(); return; }
  pendingBio = { username: normUser(u), password: p };
  busyLogin = true; render();
  try {
    await Au.signInWithEmailAndPassword(auth, normUser(u) + '@' + DOMAIN, p);
  } catch (e) { authMsg = friendlyAuthError(e); pendingBio = null; }
  busyLogin = false;
  if (!fbUser) render();
}
async function doBioLogin() {
  bioBusy = true; authMsg = ''; render();
  try {
    const { username, password } = await bioUnlock();
    await Au.signInWithEmailAndPassword(auth, username + '@' + DOMAIN, password);
  } catch (e) {
    authMsg = (e && e.name === 'NotAllowedError') ? 'No se reconoció la huella. Probá de nuevo o usá tu clave.' : friendlyAuthError(e);
  }
  bioBusy = false;
  if (!fbUser) render();
}

function weekBar(prev, next, label) {
  return '<div class="datebar">' +
    '<button class="iconbtn" data-a="' + prev + '" aria-label="Semana anterior">' + CHEV_L + '</button>' +
    '<div class="datepick" style="overflow:visible"><span>' + label + '</span></div>' +
    '<button class="iconbtn" data-a="' + next + '" aria-label="Semana siguiente">' + CHEV_R + '</button></div>';
}

/* --- equipo --- */
function staffWeek(sat) {
  const from = addDays(sat, -6); // suma incluye cualquier dato histórico de domingo, por seguridad de los montos
  const recs = myRecs.filter(r => r.date >= from && r.date <= sat);
  return { recs, total: sum(recs, r => r.commission), days: new Set(recs.map(r => r.date)).size };
}

function viewHoy() {
  const recs = myRecs.filter(r => r.date === selDate).sort((a, b) => a.t - b.t);
  const tot = sum(recs, r => r.commission);
  const isToday = selDate === today;
  let flash = false;
  if (isToday && recsReady) {
    flash = lastDayTotalSeen !== null && tot !== lastDayTotalSeen;
    lastDayTotalSeen = tot;
  }
  let h = dateBarHoy();
  const isSun = parse(selDate).getDay() === 0;
  const canAdd = selDate <= today && (isToday || backfill) && !isSun;
  if (isSun) h += '<p class="warn">🌙 Los domingos no se trabaja. ¡Disfrutá tu día libre!</p>';
  else if (!isToday) h += '<p class="warn">' + (backfill ? 'Estás cargando un día pasado (habilitado por Nel).' : 'Estás viendo un día pasado. No se puede cargar acá.') + '<button class="link" data-a="date-today">Volver a hoy</button></p>';
  h += '<section class="summary"><div class="lbl">Tu comisión del día</div><div class="big' + (flash ? ' pulse' : '') + '">' + famt(tot) + '</div>' +
       '<div class="stats"><span><b>' + recs.length + '</b> ' + plural(recs.length, 'servicio', 'servicios') + '</span></div></section>';
  if (isSat(selDate)) {
    const w = staffWeek(selDate);
    const presToday = myPresentismo.find(p => p.date === selDate);
    const totToday = w.total + (presToday ? presToday.amount : 0);
    h += '<section class="cobro"><div class="lbl">Día de pago: total semana' + (presToday ? ' + presentismo' : '') + '</div><div class="big">' + famt(totToday) + '</div>' +
         '<div class="stats"><span>Semana del ' + shortDate(addDays(selDate, -5)) + ' al ' + shortDate(selDate) + ', ' + w.days + ' ' + plural(w.days, 'día trabajado', 'días trabajados') + '</span></div>' +
         '<button class="link" data-a="goto-semana">Ver detalle de la semana</button></section>';
  }
  if (isToday && bucket() === 1 && !dayIsClosed(todayDoc) && recs.length) h += '<p class="warn">Son más de las 22:00 y todavía no finalizaste la jornada. Se cierra sola a las 22:30.<button class="link" data-a="finish-day">Finalizar ahora</button></p>';
  if (canAdd) {
    if (isToday && dayIsClosed(todayDoc)) {
      h += '<div class="closedbox"><div class="lbl">Jornada finalizada</div><div class="big">' + famt(tot) + '</div>' +
           '<p class="sub">Si fue un error, avisale a Nel para que la reabra.</p></div>';
    } else {
      const mine = services.filter(s => myCategories && myCategories[s.category || DEFAULT_CATEGORY]);
      h += '<h2>Tocá para anotar</h2>';
      if (mine.length) {
        const byCat = {};
        mine.forEach(s => { const c = s.category || DEFAULT_CATEGORY; (byCat[c] = byCat[c] || []).push(s); });
        const cats = Object.keys(byCat);
        if (selectedCat && !byCat[selectedCat]) selectedCat = null;
        if (cats.length > 1 && !selectedCat) {
          h += '<div class="cattiles">' + cats.map((c, i) =>
            '<button class="cattile ' + CAT_TONES[i % CAT_TONES.length] + '" data-a="pick-cat" data-cat="' + esc(c) + '">' + catIcon(c) + '<span>' + esc(c) + '</span></button>'
          ).join('') + '</div>';
        } else {
          const cat = selectedCat || cats[0];
          if (cats.length > 1) h += '<button class="catback" data-a="cat-back"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Categorías</button>';
          h += '<div class="svcgrid">' + byCat[cat].map(s =>
            '<button class="svc" data-a="add-rec" data-id="' + s.id + '"><b>' + esc(s.name) + '</b>' + (s.editable ? '<span class="cm" style="font-size:15px">Ingresar monto</span>' : '<span class="cm">+' + famt(commissionOn(s, selDate)) + '</span>') + '</button>'
          ).join('') + '</div>';
        }
      } else h += '<p class="empty">No tenés servicios habilitados todavía. Avisale a Nel.</p>';
      if (isToday && recs.length) h += '<button class="finishbtn" data-a="finish-day"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Finalizar jornada</button>';
    }
  }
  h += '<h2>' + (isToday ? 'Anotados del día' : 'Servicios de ese día') + '</h2>';
  if (!recsReady) h += '<p class="empty">Cargando…</p>';
  else if (recs.length) {
    const first = {};
    recs.forEach(r => { if (first[r.serviceName] === undefined) first[r.serviceName] = r.t; });
    const grouped = recs.slice().sort((a, b) => (first[a.serviceName] - first[b.serviceName]) || String(a.serviceName).localeCompare(String(b.serviceName)) || (a.t - b.t));
    h += '<div class="list">' + grouped.map(r =>
      '<div class="row' + (r.id === justAddedId ? ' new' : '') + '"><div class="grow"><div class="nm">' + esc(r.serviceName) + '</div><div class="sub">' + hhmm(r.t) + '</div></div>' +
      '<div class="amt">+' + famt(r.commission) + '</div>' +
      '<button class="x" data-a="del-rec" data-id="' + r.id + '" aria-label="Quitar ' + esc(r.serviceName) + '">×</button></div>'
    ).join('') + '</div>';
  } else h += '<p class="empty">Todavía no se anotó nada este día.</p>';
  if (tipsAllowed) h += tipSection(myTips.filter(t => t.date === selDate), isToday ? 'hoy' : 'ese día', isToday);
  return h;
}
/* tarjetas de propinas, estilo "producto" (icono + título/observación + monto) */
function tipSection(tips, label, addable) {
  tips = tips.slice().sort((a, b) => b.t - a.t);
  const tot = sum(tips, t => t.amount);
  let h = '<div class="tipbox"><div class="head2"><h2 class="tiphead"><span class="tipicon"></span>Propinas de ' + label + '</h2>' +
    '<span class="tiptot">' + famt(tot) + '</span></div>';
  if (tips.length) {
    h += '<div class="tipcards">' + tips.map(t =>
      '<div class="tipcard"><span class="tipicon sm"></span>' +
      '<div class="info"><div class="ttl">' + esc(t.note || 'Propina') + '</div><div class="sub">' + (t.date ? shortDate(t.date) + ' · ' : '') + hhmm(t.t) + '</div></div>' +
      '<div class="right"><span class="pricepill">+' + famt(t.amount) + '</span>' +
      (t.date === today ? '<button class="x" data-a="del-tip" data-id="' + t.id + '" aria-label="Quitar propina">×</button>' : '') + '</div></div>'
    ).join('') + '</div>';
  } else h += '<p class="empty" style="margin-top:0">Todavía no anotaste ninguna propina ' + label + '.</p>';
  if (addable) h += '<button class="bigbtn" data-a="new-tip"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Registrar propina</button>';
  h += '</div>';
  return h;
}

function viewHistorial() {
  let h = '<div class="seg" role="tablist">' +
    '<button data-a="hist-mode" data-v="semana" aria-current="' + (historyMode === 'semana') + '">Semanas</button>' +
    '<button data-a="hist-mode" data-v="mes" aria-current="' + (historyMode === 'mes') + '">Meses</button></div>';
  if (!recsReady) return h + '<p class="empty">Cargando…</p>';
  h += '<h2 style="margin-top:20px">' + (historyMode === 'semana' ? 'Últimas semanas' : 'Últimos meses') + '</h2><div class="list">';
  if (historyMode === 'semana') {
    let sat = satOnOrAfter(today);
    for (let i = 0; i < 10; i++) {
      const from = addDays(sat, -6);
      const rs = myRecs.filter(r => r.date >= from && r.date <= sat);
      const adv = myAdvances.filter(a => a.date >= from && a.date <= sat);
      const net = sum(rs, r => r.commission) - sum(adv, a => a.amount);
      const days = new Set(rs.map(r => r.date)).size;
      h += '<button class="row" data-a="goto-week" data-date="' + sat + '"><div class="grow"><div class="nm">Semana del ' + shortDate(from) + ' al ' + shortDate(sat) + '</div>' +
           '<div class="sub">' + days + ' ' + plural(days, 'día trabajado', 'días trabajados') + '</div></div>' +
           (rs.length || adv.length ? '<div class="amt">' + famt(net) + '</div>' : '<div class="amt zero">—</div>') + '</button>';
      sat = addDays(sat, -7);
    }
  } else {
    const cur = parse(today); cur.setDate(1);
    for (let i = 0; i < 6; i++) {
      const y = cur.getFullYear(), m = cur.getMonth(), key = y + '-' + pad(m + 1);
      const rs = myRecs.filter(r => r.date.slice(0, 7) === key);
      const adv = myAdvances.filter(a => a.date.slice(0, 7) === key);
      const net = sum(rs, r => r.commission) - sum(adv, a => a.amount);
      const days = new Set(rs.map(r => r.date)).size;
      h += '<div class="row"><div class="grow"><div class="nm">' + cap(MONTHS[m]) + ' ' + y + '</div>' +
           '<div class="sub">' + days + ' ' + plural(days, 'día trabajado', 'días trabajados') + '</div>' +
           (exportAllowed && (rs.length || adv.length) ? '<button class="expbtn" data-a="export-month" data-key="' + key + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14"/></svg>Exportar</button>' : '') + '</div>' +
           (rs.length || adv.length ? '<div class="amt">' + famt(net) + '</div>' : '<div class="amt zero">—</div>') + '</div>';
      cur.setMonth(m - 1);
    }
  }
  return h + '</div><p class="hint">Los montos ya tienen restados los adelantos. Puede no incluir semanas muy antiguas.</p>';
}

const PDF_W = 595, PDF_H = 842, PDF_M = 40, PDF_CW = 515;
const PDF_WR = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const PDF_WB = [278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584];
function pdfW(s, size, bold) {
  const tb = bold ? PDF_WB : PDF_WR; let w = 0;
  for (const ch of String(s).normalize('NFD').replace(/[̀-ͯ]/g, '')) {
    const c = ch.charCodeAt(0);
    w += c >= 32 && c <= 126 ? tb[c - 32] : (c === 0xAE || c === 0xA9 ? 737 : c === 0xB7 ? 278 : 556);
  }
  return w * size / 1000;
}
function pdfEnc(s) { // texto -> literal PDF en WinAnsi (solo ASCII en el archivo)
  let o = '';
  for (const ch of String(s).replace(/[–—]/g, '-').replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/️/g, '')) {
    const c = ch.charCodeAt(0);
    if (c === 40 || c === 41 || c === 92) o += '\\' + ch;
    else if (c >= 32 && c <= 126) o += ch;
    else if (c >= 160 && c <= 255) o += '\\' + c.toString(8).padStart(3, '0');
    else o += '';
  }
  return o;
}
const pdfCol = hex => [1, 3, 5].map(i => (parseInt(hex.slice(i, i + 2), 16) / 255).toFixed(3)).join(' ');
const pdfN = n => (Math.round(n * 100) / 100).toString();
function pdfFit(s, size, bold, max) {
  if (pdfW(s, size, bold) <= max) return s;
  while (s.length > 1 && pdfW(s + '...', size, bold) > max) s = s.slice(0, -1);
  return s + '...';
}
function pdfBuild(opt) {
  const pages = []; let cur = null, y = 0;
  const newPage = () => { cur = []; pages.push(cur); y = PDF_M + 8; if (pages.length > 1) { text(PDF_M, 30, opt.header, { size: 8, color: '#8a7a84' }); y = 50; } };
  const text = (x, yy, s, o = {}) => {
    const size = o.size || 10, bold = !!o.bold; let xx = x;
    if (o.align === 'right') xx = x - pdfW(s, size, bold); else if (o.align === 'center') xx = x - pdfW(s, size, bold) / 2;
    cur.push('BT /' + (bold ? 'F2' : 'F1') + ' ' + size + ' Tf ' + pdfCol(o.color || '#2a1b24') + ' rg ' + pdfN(xx) + ' ' + pdfN(PDF_H - yy) + ' Td (' + pdfEnc(s) + ') Tj ET');
  };
  const rect = (x, yy, w, h, hex, r) => cur.push(pdfCol(hex) + ' rg ' + pdfN(x) + ' ' + pdfN(PDF_H - yy - h) + ' ' + pdfN(w) + ' ' + pdfN(h) + ' re f');
  const hline = (yy, hex, x1 = PDF_M, x2 = PDF_W - PDF_M) => cur.push(pdfCol(hex) + ' RG 0.6 w ' + pdfN(x1) + ' ' + pdfN(PDF_H - yy) + ' m ' + pdfN(x2) + ' ' + pdfN(PDF_H - yy) + ' l S');
  const ensure = h => { if (y + h > PDF_H - 60) newPage(); };
  const AC = '#D6246E', DEEP = '#8A1554', SOFT = '#FCE3EF', MUT = '#6f5d69', LINE = '#ead7e0';

  newPage();
  // Portada / encabezado
  rect(0, 0, PDF_W, 96, DEEP);
  rect(0, 90, PDF_W, 6, AC);
  text(PDF_M, 46, opt.title, { size: 21, bold: true, color: '#FFFFFF' });
  text(PDF_M, 70, opt.monthLabel + '  ·  ' + opt.name, { size: 12, color: '#FCE3EF' });
  y = 118;
  rect(PDF_M, y, PDF_CW, 30, SOFT);
  rect(PDF_M, y, 4, 30, AC);
  text(PDF_M + 14, y + 19, 'Este informe es un resumen de lo registrado en la app. No es un recibo de sueldo.', { size: 9.5, bold: true, color: DEEP });

    text(x + 8, y + 17, c[0], { size: 7.5, color: MUT });

  y += 76;

  // Resumen por semana
  text(PDF_M, y, 'Resumen por semana', { size: 13, bold: true, color: DEEP }); y += 10;
  const cx = [PDF_M + 8, PDF_M + 240, PDF_M + 300, PDF_W - PDF_M - 95, PDF_W - PDF_M - 8];
  rect(PDF_M, y, PDF_CW, 22, DEEP);

  text(cx[4], y + 17, opt.money(T.adv), { size: 10, bold: true, align: 'right' });
  y += 44;

    const a = 35 * Math.PI / 180, c = Math.cos(a), s = Math.sin(a), size = 34, tw = pdfW('NicSys Team', size, true);
    p.push('q /GS1 gs ' + pdfCol(AC) + ' rg');
    let row = 0;
    for (let cy = 60; cy < PDF_H + 120; cy += 130, row++) {

      }
    }
    p.push('Q');
  });

  // Armado del archivo
  const objs = [];
  const add = s => { objs.push(s); return objs.length; };
  add('<< /Type /Catalog /Pages 2 0 R >>');
  add('PAGES');
  add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  add('<< /Type /ExtGState /ca 0.2 /CA 0.2 >>');
  const kids = [];
  pages.forEach(p => {
    const body = p.join('\n');
    const cid = add('<< /Length ' + body.length + ' >>\nstream\n' + body + '\nendstream');
    const pid = add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + PDF_W + ' ' + PDF_H + '] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> /ExtGState << /GS1 5 0 R >> >> /Contents ' + cid + ' 0 R >>');
    kids.push(pid + ' 0 R');
  });
  objs[1] = '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + kids.length + ' >>';
  let out = '%PDF-1.4\n'; const off = [];
  objs.forEach((o, i) => { off.push(out.length); out += (i + 1) + ' 0 obj\n' + o + '\nendobj\n'; });
  const xr = out.length;
  out += 'xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n' + off.map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('') +
    'trailer\n<< /Size ' + (objs.length + 1) + ' /Root 1 0 R /Info << /Title (' + pdfEnc(opt.title) + ') /Producer (NicSys Team) >> >>\nstartxref\n' + xr + '\n%%EOF';
  const bytes = new Uint8Array(out.length);
  for (let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 255;
  return bytes;
}

function pdfMonthData(key, recs, advs) {
  const y = +key.slice(0, 4), m = +key.slice(5, 7) - 1;
  const first = key + '-01', last = key + '-' + pad(new Date(y, m + 1, 0).getDate());
  recs = recs.filter(r => r.date >= first && r.date <= last);
  advs = advs.filter(a => a.date >= first && a.date <= last);
  const weeks = [];
  let sat = satOnOrAfter(first);
  for (;;) {
    const from = addDays(sat, -6) < first ? first : addDays(sat, -6), to = sat > last ? last : sat;
    const wr = recs.filter(r => r.date >= from && r.date <= to), wa = advs.filter(a => a.date >= from && a.date <= to);
    const dates = [...new Set(wr.map(r => r.date))].sort();
    weeks.push({
      label: 'Semana del ' + shortDate(from) + ' al ' + shortDate(to),
      days: dates.length, count: wr.length, comm: sum(wr, r => r.commission), adv: sum(wa, a => a.amount),
      daysList: dates.map(d => {
        const dr = wr.filter(r => r.date === d);
        const firstT = {}; dr.forEach(r => { if (firstT[r.serviceName] === undefined) firstT[r.serviceName] = r.t; });
        dr.sort((a, b) => (firstT[a.serviceName] - firstT[b.serviceName]) || String(a.serviceName).localeCompare(String(b.serviceName)) || (a.t - b.t));
        return { label: longDate(d), comm: sum(dr, r => r.commission), recs: dr.map(r => ({ name: r.serviceName, time: hhmm(r.t), comm: r.commission })) };
      }),
      advList: wa.slice().sort((a, b) => a.t - b.t).map(a => ({ label: shortDate(a.date), note: a.note, amount: a.amount }))
    });
    if (sat >= last) break;
    sat = addDays(sat, 7);
  }
  return { weeks, totals: { comm: sum(recs, r => r.commission), adv: sum(advs, a => a.amount), count: recs.length, days: new Set(recs.map(r => r.date)).size }, y, m };
}

let exporting = false;
async function savePdf(bytes, filename) {
  const blob = new Blob([bytes], { type: 'application/pdf' });
  const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  try {
    const file = new File([blob], filename, { type: 'application/pdf' });
    if (coarse && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: filename }); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return true; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.rel = 'noopener'; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 20000);
  return true;
}
async function exportMonth(key, btn) {
  if (!exportAllowed) { toast('El PDF no está habilitado para tu usuario.'); return; }
  if (exporting || !/^\d{4}-\d{2}$/.test(key || '')) return;
  exporting = true; if (btn) btn.disabled = true;
  toast('Generando PDF…');
  try {
    const y = +key.slice(0, 4), m = +key.slice(5, 7) - 1;
    const first = key + '-01', last = key + '-' + pad(new Date(y, m + 1, 0).getDate());
    const [sr, sa] = await Promise.all([
      F.getDocs(query(collection(db, 'staff', fbUser.uid, 'records'), where('date', '>=', first), where('date', '<=', last))),
      F.getDocs(query(collection(db, 'staff', fbUser.uid, 'advances'), where('date', '>=', first), where('date', '<=', last)))
    ]);
    const D = pdfMonthData(key, sr.docs.map(d => d.data()), sa.docs.map(d => d.data()).concat(ownerAdvItems(myOwnerAdv).map(a => ({ amount: a.amount, date: a.date, t: a.t, note: ADV_LABEL[a.kind] + (a.note ? ' - ' + a.note : '') }))));
    if (!D.totals.count && !D.totals.adv) { toast('No hay servicios ni adelantos en ese mes.'); return; }
    const label = cap(MONTHS[m]) + ' ' + y, now = new Date();
    const bytes = pdfBuild({
      title: 'Historial Mensual ' + label, monthLabel: 'NicSys Team', name: staffName || 'Equipo',
      header: 'Historial Mensual ' + label + '  ·  NicSys Team  ·  ' + (staffName || ''),
      generated: pad(now.getDate()) + '/' + pad(now.getMonth() + 1) + '/' + now.getFullYear() + ' ' + hhmm(now.getTime()),
      money: fmt, weeks: D.weeks, totals: D.totals
    });
    await savePdf(bytes, 'Historial-Mensual-NicSys-' + MONTHS[m] + '-' + y + '.pdf');
    toast('PDF listo: ' + label);
  } catch (e) { console.error(e); toast('No se pudo generar el PDF. Probá de nuevo.'); }
  finally { exporting = false; if (btn) btn.disabled = false; }
}

function viewResumen() {

    }
    if (adv.length) {
      inner += '<div class="dline head"><span>Adelantos</span><span>-' + fmt(advSum) + '</span></div>';
      adv.forEach(a => {
        inner += '<div class="dline"><span>' + shortDate(a.date) + (a.owner ? ' · ' + ADV_LABEL[a.kind] : '') + (a.note ? ' · ' + esc(a.note) : '') + '</span><span>-' + fmt(a.amount) +
                 ' <button class="x" data-a="owner-del-adv" data-sid="' + s.id + '" data-id="' + a.id + '" aria-label="Quitar">×</button></span></div>';
      });
    }
    if (presAmt > 0) {
      inner += '<div class="dline head"><span>Presentismo</span><span>+' + fmt(presAmt) + ' <button class="x" data-a="owner-del-pres" data-sid="' + s.id + '" aria-label="Quitar">×</button></span></div>';
    }
    if (!inner) inner = '<p class="sub" style="margin:6px 0 0">Sin servicios esta semana.</p>';
    rows += '<details class="pers" data-sid="' + s.id + '"' + (openStaff.has(s.id) ? ' open' : '') + '><summary><div class="grow"><div class="nm">' + esc(s.name) + '</div>' +
            '<div class="sub">' + days + ' ' + plural(days, 'día trabajado', 'días trabajados') + ', ' + rs.length + ' ' + plural(rs.length, 'servicio', 'servicios') +
            (advSum > 0 ? ', adelantos ' + fmt(advSum) : '') + '</div></div>' +
            '<div class="amt">' + fmt(net) + '</div></summary><div class="inner">' + inner + '</div></details>';
  });
  let h = weekBar('week-prev', 'week-next', 'Del ' + shortDate(from) + ' al ' + shortDate(weekEnd));
  if (weekEnd !== satOnOrAfter(today)) h += '<button class="link" data-a="week-now">Ir a esta semana</button>';
  h += '<section class="cobro"><div class="lbl">Total a pagar el ' + longDate(weekEnd).toLowerCase() + '</div><div class="big">' + fmt(grand) + '</div>' +
       '<div class="stats"><span>' + staffList.length + ' ' + plural(staffList.length, 'persona', 'personas') + '</span></div></section>';
  h += '<h2>Por persona</h2>';
  h += staffList.length ? '<div class="list">' + rows + '</div>' : '<p class="empty">Agregá personas en la sección Equipo.</p>';
  return h;
}

function animateView() {
  const w = document.querySelector('.wrap');
  if (!w || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  w.style.opacity = '0'; w.style.transform = 'translateY(6px)';
  requestAnimationFrame(() => { w.style.opacity = '1'; w.style.transform = 'none'; });
}

/* ---------- hoja de edición ---------- */
function previewText() {
  const p = parsePrice(sheet.price), c = parsePct(sheet.pct);
  return (p > 0 && c >= 0 && c <= 100) ? fmt(commissionOf(p, c)) : '—';
}
function priceChanged() {
  const s = sheet; if (!s || !s.id) return false;
  return parsePrice(s.price) !== parsePrice(s.origPrice) || parsePct(s.pct) !== parsePct(s.origPct);
}
function catCheckboxes(selected) {
  return '<div class="catgroup">' + allCategories().map(c =>
    '<label class="catchip"><input type="checkbox" data-cat="' + esc(c) + '"' + (selected[c] ? ' checked' : '') + '> ' + esc(c) + '</label>'
  ).join('') + '</div>';
}
function renderSheet(focusId) {
  const el = $('sheet');
  if (!sheet) { el.innerHTML = ''; el.hidden = true; return; }
  el.hidden = false;
  const s = sheet; let title = '', body = '';
  if (s.type === 'service') {
    title = s.id ? 'Editar servicio' : 'Nuevo servicio';
    if (s.confirm) {
      body = '<p>¿Eliminar «' + esc(s.name) + '»? Los servicios ya anotados por tu equipo se mantienen.</p>' +
        '<div class="actions"><button class="btn danger" data-a="service-delete-yes">Sí, eliminar</button><button class="btn ghost" data-a="service-delete-no">No, volver</button></div>';
    } else {
      body = '<label class="fld"><span>Nombre</span><input id="f-name" type="text" value="' + esc(s.name) + '" placeholder="Manos semi" autocomplete="off"></label>' +
        '<label class="fld"><span>Categoría</span><input id="f-cat" list="cat-list" type="text" value="' + esc(s.category) + '" placeholder="Manos" autocomplete="off">' +
        '<datalist id="cat-list">' + allCategories().map(c => '<option value="' + esc(c) + '">').join('') + '</datalist></label>' +
        '<div class="two"><label class="fld"><span>Valor ($)</span><input id="f-price" inputmode="numeric" value="' + esc(s.price) + '" placeholder="25000" autocomplete="off"></label>' +
        '<label class="fld"><span>Comisión (%)</span><input id="f-pct" inputmode="decimal" value="' + esc(s.pct) + '" placeholder="30" autocomplete="off"></label></div>' +
        '<div class="preview"><span>Comisión por servicio</span><b id="f-prev">' + previewText() + '</b></div>' +
        '<label class="catchip" style="margin-top:12px"><input type="checkbox" id="f-edit"' + (s.editable ? ' checked' : '') + '> El equipo edita el monto (ej. Diseño completo)</label>' +
        (s.id ? '<div id="f-fromblk"' + (priceChanged() ? '' : ' hidden') + ' style="margin-top:6px"><label class="fld"><span>¿Desde cuándo rige el nuevo valor?</span><input id="f-from" type="date" value="' + esc(s.from) + '"></label>' +
        '<p class="hint" style="margin-top:-6px">Lo ya anotado no cambia. Los días anteriores a esa fecha siguen con el valor viejo.</p></div>' : '') +
        '<p class="err" id="f-err" role="alert"></p>' +
        '<div class="actions"><button class="btn" data-a="service-save">Guardar</button><button class="btn ghost" data-a="sheet-close">Cancelar</button></div>' +
        (s.id ? '<div style="margin-top:14px"><button class="link danger" data-a="service-delete">Eliminar servicio</button></div><p class="hint">Los cambios no modifican lo que ya se anotó en días anteriores.</p>' : '');
    }
  } else if (s.type === 'prices') {
    title = 'Actualizar precios';
    body = '<label class="fld"><span>¿Desde cuándo rigen los nuevos valores?</span><input id="p-from" type="date" value="' + esc(s.from) + '"></label>' +
      '<p class="hint" style="margin:-6px 0 10px">Completá solo los servicios que cambian. Lo ya anotado no se modifica.</p>' +
      services.map(x => '<label class="fld" style="margin-bottom:10px"><span>' + esc(x.name) + ' (hoy ' + fmt(priceOn(x, today).price) + ')</span>' +
        '<input data-pid="' + x.id + '" inputmode="numeric" value="' + esc(s.vals[x.id] || '') + '" placeholder="Nuevo valor" autocomplete="off"></label>').join('') +
      '<p class="err" id="f-err" role="alert"></p>' +
      '<div class="actions"><button class="btn" data-a="prices-save">Aplicar</button><button class="btn ghost" data-a="sheet-close">Cancelar</button></div>';
  } else if (s.type === 'custom') {
    title = esc(s.name);
    body = '<p class="sub" style="margin:0 0 12px">' + longDate(s.date) + '. Escribí tu comisión de este servicio.</p>' +
      '<label class="fld"><span>Tu comisión ($)</span><input id="c-amount" inputmode="numeric" value="' + esc(s.amount) + '" autocomplete="off"></label>' +
      '<p class="err" id="f-err" role="alert"></p>' +
      '<div class="actions"><button class="btn" data-a="custom-save">Anotar</button><button class="btn ghost" data-a="sheet-close">Cancelar</button></div>';
  } else if (s.type === 'staff-new') {
    title = 'Nueva persona';
    if (s.done) {
      body = '<p>Listo. Pasale estos datos a ' + esc(s.done.name) + ':</p><div class="cred">Usuario: <b>' + esc(s.done.user) + '</b><br>Clave: <b>' + esc(s.done.pass) + '</b></div>' +
        '<p class="hint">Cuando entre por primera vez va a elegir qué servicios hace.</p>' +
        '<div class="actions"><button class="btn" data-a="sheet-close">Listo</button></div>';
    } else {
      body = '<label class="fld"><span>Nombre</span><input id="s-name" type="text" value="' + esc(s.name) + '" placeholder="Ana" autocomplete="off"></label>' +
        '<label class="fld"><span>Usuario (sin espacios)</span><input id="s-user" type="text" value="' + esc(s.user) + '" placeholder="ana" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off"></label>' +
        '<label class="fld"><span>Clave (mínimo 6 caracteres)</span><input id="s-pass" type="text" value="' + esc(s.pass) + '" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off"></label>' +
        '<p class="err" id="f-err" role="alert"></p>' +
        '<div class="actions"><button class="btn" data-a="staff-save"' + (s.busy ? ' disabled' : '') + '>' + (s.busy ? 'Creando…' : 'Crear usuario') + '</button><button class="btn ghost" data-a="sheet-close">Cancelar</button></div>';
    }
  } else if (s.type === 'staff-del') {
    title = 'Quitar persona';
    body = '<p>¿Quitar a ' + esc(s.name) + '? Ya no va a poder entrar a la app. Sus servicios anotados se mantienen.</p>' +
      '<div class="actions"><button class="btn danger" data-a="staff-delete-yes">Sí, quitar</button><button class="btn ghost" data-a="sheet-close">No, volver</button></div>';
  } else if (s.type === 'staff-cat') {
    title = 'Servicios de ' + esc(s.name);
    body = (allCategories().length ? catCheckboxes(s.categories) : '<p class="empty">Primero cargá servicios con una categoría, en Servicios.</p>') +
      '<p class="err" id="f-err" role="alert"></p>' +
      '<div class="actions"><button class="btn" data-a="staffcat-save">Guardar</button><button class="btn ghost" data-a="sheet-close">Cancelar</button></div>';
  } else if (s.type === 'onboard') {
    title = '¿Qué servicios hacés?';
    body = '<p class="sub" style="margin:0 0 12px">Elegí lo que vas a registrar. Nel puede sumarte otros después.</p>' +
      catCheckboxes(s.categories) +
      '<p class="err" id="f-err" role="alert"></p>' +
      '<div class="actions"><button class="btn" data-a="onboard-save">Empezar</button></div>';
  } else if (s.type === 'settings') {
    title = 'Soporte';
    const reqOf = t => myRequests.find(r => r.type === t);
    const row = (t, name, desc, enabled, why) => {
      const r = reqOf(t), pend = r && r.status === 'pending';
      return '<div class="reqrow"><div class="nm">' + name + '</div><div class="sub">' + desc + '</div>' +
        (r ? '<span class="reqst ' + (r.status === 'pending' ? 'p' : r.status === 'approved' ? 'a' : 'r') + '">' + (pend ? 'Pendiente de Nel' : r.status === 'approved' ? 'Aceptada' : 'No aceptada') + '</span>' : '') +
        '<div class="actions">' + (pend ? '<button class="btn ghost" disabled>Solicitud enviada</button>' :
          enabled ? '<button class="btn" data-a="send-request" data-t="' + t + '">Enviar solicitud</button>' : '<p class="sub">' + why + '</p>') + '</div></div>';

const setErr = msg => { const e = $('f-err'); if (e) e.textContent = msg; };

/* ---------- avisos ---------- */
let toastT;
function toast(msg, undo) {
  const t = $('toast');
  t.innerHTML = esc(msg) + (undo ? '<button class="link inv" data-a="undo">Deshacer</button>' : '');
  t.hidden = false;
  t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.hidden = true; }, 4000);
}

/* ---------- acciones ---------- */
function addRecord(s, amount) {
  if (parse(selDate).getDay() === 0) return; // no se trabaja los domingos
  if (selDate > today || (selDate === today && dayIsClosed(todayDoc)) || (selDate !== today && !backfill)) return;
  const commission = amount != null ? amount : commissionOn(s, selDate);
  soundAdd();
  const ref = doc(collection(db, 'staff', fbUser.uid, 'records'));
  const rec = { serviceId: s.id, serviceName: s.name, commission, date: selDate, t: Date.now() };
  lastAction = { kind: 'added', sid: fbUser.uid, id: ref.id };
  justAddedId = ref.id;
  setTimeout(() => { justAddedId = null; render(); }, 650);
  setDoc(ref, rec).catch(e => { console.error(e); toast('No se pudo anotar. Actualizá e intentá de nuevo.'); });
  toast('Anotado: ' + s.name + ' ' + famt(commission), true);
}
function removeRecord(sid, id, list) {
  const rec = list.find(r => r.id === id); if (!rec) return;
  const data = { serviceId: rec.serviceId, serviceName: rec.serviceName, commission: rec.commission, date: rec.date, t: rec.t };
  lastAction = { kind: 'removed', sid, id, data };
  deleteDoc(doc(db, 'staff', sid, 'records', id)).catch(e => { console.error(e); toast('No se pudo quitar.'); });
  toast('Servicio quitado', true);
}
function undo() {
  const a = lastAction; lastAction = null; $('toast').hidden = true;
  if (!a) return;
  if (a.kind === 'added') deleteDoc(doc(db, 'staff', a.sid, 'records', a.id)).catch(console.error);
  else setDoc(doc(db, 'staff', a.sid, 'records', a.id), a.data).catch(e => { console.error(e); toast('No se pudo deshacer.'); });
}

function saveService() {
  const name = sheet.name.trim(), price = parsePrice(sheet.price), pct = parsePct(sheet.pct);
  const category = (sheet.category || '').trim() || DEFAULT_CATEGORY;
  if (!name) return setErr('Escribí el nombre del servicio.');
  if (!(price > 0)) return setErr('Ingresá un valor mayor a 0.');
  if (!(pct >= 0 && pct <= 100)) return setErr('La comisión va de 0 a 100.');
  const existing = services.find(x => x.id === sheet.id);
  const id = sheet.id || doc(collection(db, 'prices')).id;
  const order = existing ? (existing.order || Date.now()) : Date.now();
  let hist = existing ? histOf(existing) : [{ from: HIST0, price, pct }];
  if (existing && priceChanged()) {
    if (!validDate(sheet.from)) return setErr('Elegí desde qué fecha rige el nuevo valor.');
    hist = withChange(hist, price, pct, sheet.from);
  }
  const b = writeBatch(db);
  putService(b, id, name, category, order, sheet.editable, hist);
  b.commit().catch(e => { console.error(e); toast('No se pudo guardar el servicio.'); });
  sheet = null; renderSheet();
}
function savePrices() {
  if (!validDate(sheet.from)) return setErr('Elegí desde qué fecha rigen los nuevos valores.');
  const b = writeBatch(db); let n = 0;
  for (const x of services) {
    const raw = String(sheet.vals[x.id] || '').trim(); if (!raw) continue;
    const p = parsePrice(raw); if (!(p > 0)) return setErr('Revisá el valor de «' + x.name + '».');
    const cur = priceOn(x, today); if (p === cur.price) continue;
    putService(b, x.id, x.name, x.category || DEFAULT_CATEGORY, x.order || Date.now(), x.editable, withChange(histOf(x), p, cur.pct, sheet.from)); n++;
  }
  if (!n) return setErr('No cambiaste ningún valor.');
  b.commit().catch(e => { console.error(e); toast('No se pudieron actualizar los precios.'); });
  toast(n + ' ' + plural(n, 'precio actualizado', 'precios actualizados') + ' desde el ' + shortDate(sheet.from));
  sheet = null; renderSheet();
}
function setBackfill(ids, on) {
  const b = writeBatch(db); ids.forEach(id => b.update(doc(db, 'staff', id), { backfill: on }));
  b.commit().catch(e => { console.error(e); toast('No se pudo cambiar.'); });
}

}
function deleteService() {
  const id = sheet.id, b = writeBatch(db);
  b.delete(doc(db, 'prices', id)); b.delete(doc(db, 'services', id));
  b.commit().catch(e => { console.error(e); toast('No se pudo eliminar.'); });

async function saveStaff() {
  const name = sheet.name.trim(), user = normUser(sheet.user), pass = sheet.pass;
  if (!name) return setErr('Escribí el nombre.');
  if (!/^[a-z0-9._-]{3,}$/.test(user)) return setErr('El usuario necesita 3 o más letras o números, sin espacios ni acentos.');
  if (user === OWNER_USER) return setErr('Ese usuario está reservado. Elegí otro.');
  if (pass.length < 6) return setErr('La clave debe tener al menos 6 caracteres.');
  sheet.busy = true; renderSheet();
  try {
    const sec = (A.getApps().find(x => x.name === 'secondary')) || A.initializeApp(firebaseConfig, 'secondary');
    const sAuth = Au.getAuth(sec);
    const cred = await Au.createUserWithEmailAndPassword(sAuth, user + '@' + DOMAIN, pass);
    await setDoc(doc(db, 'staff', cred.user.uid), { name, username: user, created: Date.now(), categories: {} });
    await Au.signOut(sAuth);
    sheet = { type: 'staff-new', done: { name, user, pass } };
    renderSheet();
  } catch (e) {
    console.error(e);
    sheet.busy = false; renderSheet();
    setErr(friendlyAuthError(e));
  }
}

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, id = b.dataset.id;
  if (a === 'tab') {
    view = b.dataset.v;
    if (view === 'semana') { weekEnd = satOnOrAfter(selDate); needRange(addDays(weekEnd, -6), weekEnd); }
    else if (view === 'hoy') needRange(selDate);
    else if (view === 'historial') loadRange(addDays(today, -190), today);
    else if (view === 'cobros') { subscribeOwnerWeek(); subscribeOwnerAdvances(); subscribeOwnerPresentismo(); subscribeOwnerDayStatus(); }
    render(); window.scrollTo(0, 0);
  }
  else if (a === 'logout') { Au.signOut(auth); }
  else if (a === 'toggle-eye') {
    hideAmounts = !hideAmounts;
    try { localStorage.setItem('nel-hide-' + fbUser.uid, hideAmounts ? '1' : '0'); } catch (e) {}
    render();
  }
  else if (a === 'date-prev') { selDate = addDays(selDate, parse(selDate).getDay() === 1 ? -2 : -1); selectedCat = null; needRange(selDate); render(); }
  else if (a === 'date-next') { if (selDate < today) { selDate = addDays(selDate, parse(selDate).getDay() === 6 ? 2 : 1); if (selDate > today) selDate = today; selectedCat = null; needRange(selDate); } render(); }
  else if (a === 'date-today') { selDate = today; selectedCat = null; needRange(selDate); render(); }
  else if (a === 'add-rec') {
    const s = services.find(x => x.id === id); if (!s) return;
    if (s.editable) { sheet = { type: 'custom', id: s.id, name: s.name, date: selDate, amount: String(commissionOn(s, selDate)) }; renderSheet('c-amount'); }
    else addRecord(s);
  }
  else if (a === 'custom-save') {
    const v = parsePrice(sheet.amount); if (!(v > 0)) return setErr('Ingresá un monto mayor a 0.');
    const s = services.find(x => x.id === sheet.id); sheet = null; renderSheet(); if (s) addRecord(s, v);
  }
  else if (a === 'pick-cat') { selectedCat = b.dataset.cat; render(); }
  else if (a === 'cat-back') { selectedCat = null; render(); }
  else if (a === 'toggle-backfill') { const p = staffList.find(x => x.id === id); if (p) setBackfill([id], !p.backfill); }
  else if (a === 'backfill-all-on') setBackfill(staffList.map(x => x.id), true);
  else if (a === 'backfill-all-off') setBackfill(staffList.map(x => x.id), false);
  else if (a === 'toggle-bio') { const p = staffList.find(x => x.id === id); if (p) setBioAllowed([id], !p.biometricAllowed); }
  else if (a === 'bio-all-on') setBioAllowed(staffList.map(x => x.id), true);
  else if (a === 'bio-all-off') setBioAllowed(staffList.map(x => x.id), false);
  else if (a === 'toggle-tips') { const p = staffList.find(x => x.id === id); if (p) setTipsAllowed([id], !p.tipsAllowed); }
  else if (a === 'toggle-export') { const p = staffList.find(x => x.id === id); if (p) setExportAllowed([id], !p.exportAllowed); }
  else if (a === 'export-all-on') setExportAllowed(staffList.map(x => x.id), true);
  else if (a === 'export-all-off') setExportAllowed(staffList.map(x => x.id), false);
  else if (a === 'tips-all-on') setTipsAllowed(staffList.map(x => x.id), true);
  else if (a === 'tips-all-off') setTipsAllowed(staffList.map(x => x.id), false);
  else if (a === 'new-prices') { sheet = { type: 'prices', from: today, vals: {} }; renderSheet(); }
  else if (a === 'prices-save') savePrices();
  else if (a === 'del-rec' || a === 'owner-del-rec') {
    const sid = a === 'del-rec' ? fbUser.uid : b.dataset.sid;
    const rec = (a === 'del-rec' ? myRecs : (recsByStaff[sid] || [])).find(r => r.id === id);
    if (rec) { sheet = { type: 'rec-del', sid, id, name: rec.serviceName, time: hhmm(rec.t), amount: rec.commission }; renderSheet(); }
  }
  else if (a === 'open-settings') { sheet = { type: role === 'owner' ? 'requests' : 'settings' }; renderSheet(); }
  else if (a === 'send-request') {
    const t = b.dataset.t; if (t !== 'reopen' && t !== 'backfill') return;
    setDoc(doc(db, 'requests', fbUser.uid + '_' + t), { uid: fbUser.uid, name: staffName, type: t, status: 'pending', t: Date.now(), date: today })
      .then(() => toast('Solicitud enviada a Nel.')).catch(e => { console.error(e); toast('No se pudo enviar la solicitud.'); });
  }
  else if (a === 'req-yes' || a === 'req-no') {
    const r = ownerRequests.find(x => x.id === id); if (!r) return;
    const ok = a === 'req-yes';
    if (ok) {
      if (r.type === 'reopen') reopenDay(r.uid);
      else updateDoc(doc(db, 'staff', r.uid), { backfill: true }).catch(e => { console.error(e); toast('No se pudo habilitar.'); });
    }
    updateDoc(doc(db, 'requests', r.id), { status: ok ? 'approved' : 'rejected', decidedAt: Date.now() }).catch(e => { console.error(e); toast('No se pudo responder.'); });
    toast(ok ? 'Solicitud aceptada.' : 'Solicitud rechazada.');
  }
  else if (a === 'export-month') exportMonth(b.dataset.key, b);
  else if (a === 'rec-del-yes') {
    const sid = sheet.sid, rid = sheet.id;
    sheet = null; renderSheet();
    removeRecord(sid, rid, sid === fbUser.uid ? myRecs : (recsByStaff[sid] || []));
  }
  else if (a === 'undo') undo();
  else if (a === 'goto-semana') { weekEnd = selDate; view = 'semana'; needRange(addDays(weekEnd, -6), weekEnd); render(); window.scrollTo(0, 0); }
  else if (a === 'goto-day') { selDate = b.dataset.date; view = 'hoy'; needRange(selDate); render(); window.scrollTo(0, 0); }
  else if (a === 'goto-week') { weekEnd = b.dataset.date; view = 'semana'; needRange(addDays(weekEnd, -6), weekEnd); render(); window.scrollTo(0, 0); }
  else if (a === 'hist-mode') { historyMode = b.dataset.v; render(); }
  else if (a === 'week-prev' || a === 'week-next' || a === 'week-now') {
    weekEnd = a === 'week-now' ? satOnOrAfter(today) : addDays(weekEnd, a === 'week-prev' ? -7 : 7);
    if (role === 'owner') { subscribeOwnerWeek(); subscribeOwnerAdvances(); subscribeOwnerPresentismo(); } else needRange(addDays(weekEnd, -6), weekEnd);
    render();
  }
  else if (a === 'new-service') { sheet = { type: 'service', id: null, name: '', price: '', pct: '30', category: DEFAULT_CATEGORY, confirm: false, editable: false, from: today }; renderSheet('f-name'); }
  else if (a === 'edit-service') {
    const s = services.find(x => x.id === id); if (!s) return;
    const cur = priceOn(s, today); sheet = { type: 'service', id: s.id, name: s.name, price: String(cur.price), pct: pctText(cur.pct), origPrice: String(cur.price), origPct: pctText(cur.pct), category: s.category || DEFAULT_CATEGORY, confirm: false, editable: !!s.editable, from: today }; renderSheet();
  }
  else if (a === 'service-save') saveService();
  else if (a === 'service-delete') { sheet.confirm = true; renderSheet(); }
  else if (a === 'service-delete-no') { sheet.confirm = false; renderSheet(); }
  else if (a === 'service-delete-yes') deleteService();
  else if (a === 'new-staff') { sheet = { type: 'staff-new', name: '', user: '', pass: '', busy: false, done: null }; renderSheet('s-name'); }
  else if (a === 'staff-save') saveStaff();
  else if (a === 'del-staff') { const s = staffList.find(x => x.id === id); if (s) { sheet = { type: 'staff-del', id: s.id, name: s.name }; renderSheet(); } }
  else if (a === 'staff-delete-yes') {
    deleteDoc(doc(db, 'staff', sheet.id)).catch(err => { console.error(err); toast('No se pudo quitar a la persona.'); });
    sheet = null; renderSheet();
  }
  else if (a === 'edit-staff-cats') {
    const s = staffList.find(x => x.id === id); if (!s) return;
    sheet = { type: 'staff-cat', id: s.id, name: s.name, categories: { ...(s.categories || {}) } }; renderSheet();
  }
  else if (a === 'staffcat-save') {
    updateDoc(doc(db, 'staff', sheet.id), { categories: sheet.categories || {} }).catch(err => { console.error(err); toast('No se pudo guardar.'); });
    sheet = null; renderSheet();
  }
  else if (a === 'reopen-day') reopenDay(id);
  else if (a === 'reopen-info') toast('Su jornada de hoy está abierta.');
  else if (a === 'onboard-save') {
    if (!sheet.categories || !Object.keys(sheet.categories).length) return setErr('Elegí al menos un servicio.');
    updateDoc(doc(db, 'staff', fbUser.uid), { categories: sheet.categories, onboarded: true }).catch(err => { console.error(err); toast('No se pudo guardar.'); });
    sheet = null; renderSheet();
  }
  else if (a === 'finish-day') {
    const recs = myRecs.filter(r => r.date === today);
    sheet = { type: 'finish-confirm', total: sum(recs, r => r.commission) }; renderSheet();
  }
  else if (a === 'finish-day-yes') {
    finalizeDay();
    if (isSat(selDate)) {
      const existing = myPresentismo.find(p => p.date === selDate);
      sheet = { type: 'presentismo', date: selDate, amount: existing ? String(existing.amount) : '10000' };
      renderSheet('pr-amount');
    } else { sheet = null; renderSheet(); }
  }
  else if (a === 'presentismo-save') savePresentismo();
  else if (a === 'edit-presentismo') {
    const existing = myPresentismo.find(p => p.date === weekEnd);
    sheet = { type: 'presentismo', date: weekEnd, amount: existing ? String(existing.amount) : '10000' };
    renderSheet('pr-amount');
  }
  else if (a === 'del-presentismo') deleteDoc(doc(db, 'staff', fbUser.uid, 'presentismo', weekEnd)).catch(err => { console.error(err); toast('No se pudo quitar.'); });
  else if (a === 'owner-adv') { sheet = { type: 'owner-adv', sid: id, amount: '', note: '', kind: 'pay' }; renderSheet('oa-amount'); }
  else if (a === 'oa-kind') { sheet.kind = b.dataset.v; renderSheet(); }
  else if (a === 'oa-save') saveOwnerAdv();
  else if (a === 'oa-del') {
    const st = staffList.find(x => x.id === sheet.sid), it = st && (st.ownerAdv || []).find(x => 'o' + x.id === id);
    if (it) updateDoc(doc(db, 'staff', st.id), { ownerAdv: F.arrayRemove(it) }).catch(e => { console.error(e); toast('No se pudo quitar.'); });
  }
  else if (a === 'new-advance') { sheet = { type: 'advance', amount: '', note: '' }; renderSheet('a-amount'); }
  else if (a === 'advance-save') saveAdvance();
  else if (a === 'del-adv') deleteDoc(doc(db, 'staff', fbUser.uid, 'advances', id)).catch(err => { console.error(err); toast('No se pudo quitar.'); });
  else if (a === 'new-tip') { sheet = { type: 'tip', amount: '', note: '' }; renderSheet('tp-amount'); }
  else if (a === 'tip-save') saveTip();
  else if (a === 'del-tip') deleteDoc(doc(db, 'staff', fbUser.uid, 'tips', id)).catch(err => { console.error(err); toast('No se pudo quitar.'); });
  else if (a === 'owner-del-adv' && id.charAt(0) === 'o') {
    const st = staffList.find(x => x.id === b.dataset.sid), it = st && (st.ownerAdv || []).find(x => 'o' + x.id === id);
    if (it) updateDoc(doc(db, 'staff', st.id), { ownerAdv: F.arrayRemove(it) }).catch(e => { console.error(e); toast('No se pudo quitar.'); });
  }
  else if (a === 'owner-del-adv') deleteDoc(doc(db, 'staff', b.dataset.sid, 'advances', id)).catch(err => { console.error(err); toast('No se pudo quitar.'); });
  else if (a === 'owner-del-pres') deleteDoc(doc(db, 'staff', b.dataset.sid, 'presentismo', weekEnd)).catch(err => { console.error(err); toast('No se pudo quitar.'); });
  else if (a === 'sheet-close') { pendingBio = null; sheet = null; renderSheet(); }
  else if (a === 'bio-login') doBioLogin();
  else if (a === 'bio-enroll') {
    if (!pendingBio) { sheet = null; renderSheet(); return; }
    bioBusy = true; renderSheet();
    bioEnroll(pendingBio.username, pendingBio.password)
      .then(() => { toast('Huella activada en este celular.', true); })
      .catch(e => { console.error(e); setErr('No se pudo activar la huella. Probá de nuevo.'); })
      .finally(() => { bioBusy = false; pendingBio = null; sheet = null; renderSheet(); });
  }
  else if (a === 'bio-forget') { bioForget(); toast('Se quitó el acceso con huella de este celular.'); render(); }
});

document.addEventListener('submit', e => {
  if (e.target.id === 'lg') { e.preventDefault(); doLogin($('lg-u').value, $('lg-p').value); }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'lg-u') { loginUser = t.value; return; }
  if (!sheet) return;
  if (sheet.type === 'service') {
    if (t.id === 'f-name') sheet.name = t.value;
    else if (t.id === 'f-price') sheet.price = t.value;
    else if (t.id === 'f-pct') sheet.pct = t.value;
    else if (t.id === 'f-cat') sheet.category = t.value;
    else if (t.id === 'f-from') { sheet.from = t.value; return; }
    else return;
    const p = $('f-prev'); if (p) p.textContent = previewText();
    const fb = $('f-fromblk'); if (fb) fb.hidden = !priceChanged();
  } else if (sheet.type === 'staff-new') {
    if (t.id === 's-name') sheet.name = t.value;
    else if (t.id === 's-user') sheet.user = t.value;
    else if (t.id === 's-pass') sheet.pass = t.value;
  } else if (sheet.type === 'prices') {
    if (t.id === 'p-from') sheet.from = t.value; else if (t.dataset.pid) sheet.vals[t.dataset.pid] = t.value;
  } else if (sheet.type === 'custom') {
    if (t.id === 'c-amount') sheet.amount = t.value;
  } else if (sheet.type === 'advance') {
    if (t.id === 'a-amount') sheet.amount = t.value;
    else if (t.id === 'a-note') sheet.note = t.value;
  } else if (sheet.type === 'owner-adv') {
    if (t.id === 'oa-amount') sheet.amount = t.value; else if (t.id === 'oa-note') sheet.note = t.value;
  } else if (sheet.type === 'tip') {
    if (t.id === 'tp-amount') sheet.amount = t.value;
    else if (t.id === 'tp-note') sheet.note = t.value;
  } else if (sheet.type === 'presentismo') {
    if (t.id === 'pr-amount') sheet.amount = t.value;
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'datein' && t.value) { let v = t.value; if (v > today) v = today; if (parse(v).getDay() === 0) v = addDays(v, -1); selDate = v; selectedCat = null; needRange(selDate); render(); }
  else if (t.id === 'f-edit' && sheet) sheet.editable = t.checked;
  else if (t.dataset && t.dataset.cat && sheet) {
    sheet.categories = sheet.categories || {};
    if (t.checked) sheet.categories[t.dataset.cat] = true; else delete sheet.categories[t.dataset.cat];
  }
});

document.addEventListener('toggle', e => {
  const d = e.target;
  if (d && d.classList && d.classList.contains('pers')) {
    if (d.open) openStaff.add(d.dataset.sid); else openStaff.delete(d.dataset.sid);
  }
}, true);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheet && sheet.type !== 'onboard') { sheet = null; renderSheet(); }
});

let bucketSeen = -1;
setInterval(() => {
  const b = bucket();
  if (role === 'staff' && recsReady) {
    const n = myRecs.filter(r => r.date === today).length;
    if (b === 1 && bucketSeen === 0 && n && !dayIsClosed(todayDoc)) { soundRemind(); toast('Son las 22:00. Recordá finalizar tu jornada.'); }
    if (b === 2 && n && !autoDone && !(todayDoc && (todayDoc.closed === true || wasReopened(todayDoc)))) {
      autoDone = true;
      setDoc(doc(db, 'staff', fbUser.uid, 'days', today), { closed: true, closedAt: Date.now() }).catch(e => { console.error(e); autoDone = false; });
    }
  }
  if (b !== bucketSeen) { bucketSeen = b; render(); }
}, 15000);
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(() => {}); }

render();
</script>
</body>
</html>
